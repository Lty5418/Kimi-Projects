<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>时空跃动</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #121212;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  color: #FFFFFF;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
#game-container {
  width: 100%; height: 100%;
  position: relative;
  overflow: hidden;
}

/* ===== 开始界面 ===== */
#start-screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100;
  background: #121212;
  transition: opacity 0.5s;
}
#start-screen .title {
  font-size: 56px; font-weight: 900;
  letter-spacing: 12px;
  color: #FFFFFF;
  text-shadow: 0 0 30px rgba(0,246,255,0.3), 0 0 60px rgba(0,246,255,0.1);
  margin-bottom: 8px;
}
#start-screen .subtitle {
  font-size: 14px; color: #8D9390;
  letter-spacing: 4px; margin-bottom: 60px;
}
.btn {
  padding: 14px 48px;
  font-size: 18px; font-weight: 700;
  border: 2px solid #E1E3E6;
  background: transparent;
  color: #FFFFFF;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 4px;
  margin: 8px 0;
}
.btn:hover {
  background: #A0DAF7; color: #121212;
  border-color: #00A1FF;
  box-shadow: 0 0 20px rgba(0,161,255,0.3);
}
.btn:active {
  background: #00A1FF;
  transform: scale(0.97);
}
.btn-row {
  display: flex; gap: 20px; margin-top: 10px;
}

/* ===== 关卡选择 ===== */
.lvl-card {
  width: 80px; height: 80px;
  background: #1a1a1a;
  border: 2px solid #707070;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 900;
  color: #707070;
  transition: all 0.3s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  flex-shrink: 0;
}
.lvl-card:hover {
  border-color: #A0DAF7;
}
.lvl-card:active {
  background: #2a2a2a;
  border-color: #00A1FF;
  transform: scale(0.95);
  transition: all 0.08s ease;
}
.lvl-card.on {
  width: 200px; height: 130px;
  border-color: #00F6FF;
  background: #1f1f1f;
  color: #FFFFFF;
  font-size: 40px;
  box-shadow: 0 0 20px rgba(0,246,255,0.15);
}
.lvl-card .lvl-num {
  transition: all 0.25s ease;
}
.lvl-card.on .lvl-num {
  font-size: 44px;
  margin-bottom: 4px;
}
.lvl-card .lvl-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.25s ease 0.08s;
  pointer-events: none;
  position: absolute;
  bottom: 14px;
  left: 0; right: 0;
}
.lvl-card.on .lvl-info {
  opacity: 1;
  transform: translateY(0);
  position: static;
  margin-top: 2px;
}
.lvl-card .lvl-name {
  font-size: 15px;
  font-weight: 700;
  color: #FFFFFF;
  letter-spacing: 2px;
  white-space: nowrap;
}
.lvl-card .lvl-tag {
  font-size: 11px;
  color: #8D9390;
  border: 1px solid #707070;
  padding: 2px 10px;
  border-radius: 3px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.lvl-card.off {
  opacity: 0.25;
  transform: scale(0.85);
}

/* ===== 登录/注册界面 ===== */
#auth-screen {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 200;
  background: #121212;
}
#auth-screen h2 {
  font-size: 32px; margin-bottom: 40px;
  letter-spacing: 6px;
  color: #FFFFFF;
}
.auth-form {
  display: flex; flex-direction: column;
  gap: 16px; width: 280px;
}
.auth-form input {
  padding: 12px 16px;
  background: #1a1a1a;
  border: 1px solid #707070;
  color: #FFFFFF;
  font-size: 15px;
  outline: none;
  transition: border-color 0.3s;
}
.auth-form input:focus {
  border-color: #00F6FF;
  box-shadow: 0 0 10px rgba(0,246,255,0.1);
}
.auth-form .btn {
  width: 100%; margin-top: 8px;
}
.auth-switch {
  color: #8D9390; font-size: 13px;
  margin-top: 16px; cursor: pointer;
  text-decoration: underline;
}
.auth-switch:hover {
  color: #A0DAF7;
}
#auth-msg {
  color: #FFD1D4; font-size: 13px;
  min-height: 20px; text-align: center;
}

/* ===== 大厅界面 ===== */
#lobby-screen {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  z-index: 90;
  background: #121212;
  padding: 20px;
}
#lobby-screen h2 {
  font-size: 28px; letter-spacing: 6px;
  margin-bottom: 20px; text-align: center;
  color: #FFFFFF;
}
.lobby-tabs {
  display: flex; gap: 0; margin-bottom: 20px;
  border-bottom: 1px solid #707070;
}
.lobby-tab {
  padding: 10px 24px;
  cursor: pointer;
  color: #8D9390;
  font-size: 14px;
  border-bottom: 2px solid transparent;
  transition: all 0.3s;
}
.lobby-tab:hover {
  color: #C3C3C3;
}
.lobby-tab.active {
  color: #FFFFFF;
  border-bottom-color: #00F6FF;
}
.lobby-content {
  flex: 1; overflow-y: auto;
}
.level-card {
  background: #1a1a1a;
  border: 1px solid #707070;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all 0.3s;
  border-radius: 4px;
}
.level-card:hover {
  border-color: #A0DAF7;
  box-shadow: 0 0 10px rgba(0,161,255,0.05);
}
.level-info h4 {
  font-size: 16px; margin-bottom: 4px;
  color: #FFFFFF;
}
.level-info p {
  font-size: 12px; color: #8D9390;
}
.level-actions {
  display: flex; gap: 8px;
}
.level-actions .btn {
  padding: 6px 16px;
  font-size: 13px;
  letter-spacing: 2px;
}
.upload-area {
  background: #1a1a1a;
  border: 2px dashed #707070;
  padding: 30px;
  text-align: center;
  margin-bottom: 20px;
  border-radius: 8px;
}
.upload-area input {
  background: #121212; border: 1px solid #707070;
  color: #FFFFFF; padding: 10px; width: 100%;
  margin-bottom: 12px; font-size: 13px;
  border-radius: 4px;
}
.upload-area input:focus {
  border-color: #00F6FF;
  outline: none;
}
.lobby-header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 20px;
}
#user-display {
  font-size: 14px; color: #8D9390;
}

/* ===== 关卡编辑器 ===== */
#editor-screen {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  z-index: 80;
  background: #121212;
}
.editor-toolbar {
  display: flex; gap: 8px; padding: 10px;
  background: #1a1a1a;
  border-bottom: 1px solid #707070;
  align-items: center;
  flex-wrap: wrap;
}
.editor-toolbar .tool-btn {
  padding: 8px 16px;
  background: #121212;
  border: 1px solid #707070;
  color: #C3C3C3;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
  border-radius: 4px;
}
.editor-toolbar .tool-btn:hover {
  border-color: #A0DAF7;
  color: #FFFFFF;
}
.editor-toolbar .tool-btn.active {
  background: #00A1FF; color: #FFFFFF; border-color: #00A1FF;
  box-shadow: 0 0 10px rgba(0,161,255,0.2);
}

.editor-coords {
  margin-left: auto;
  font-size: 12px;
  color: #8D9390;
  font-family: monospace;
  padding: 0 12px;
}
.editor-canvas-wrap {
  flex: 1; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
  touch-action: none;
  cursor: grab;
}
.editor-canvas-wrap:active {
  cursor: grabbing;
}
#editor-canvas {
  background: #121212;
  border: 1px solid #707070;
  touch-action: none;
}
.editor-bottom {
  padding: 10px; background: #1a1a1a;
  border-top: 1px solid #707070;
  display: flex; gap: 10px; align-items: center;
}
#level-code-output {
  flex: 1; background: #121212;
  border: 1px solid #707070; color: #B3F4A8;
  padding: 8px 12px; font-family: monospace;
  font-size: 12px; resize: none;
  border-radius: 4px;
}

/* ===== 游戏画布 ===== */
#game-canvas {
  position: absolute; inset: 0;
  z-index: 10;
  touch-action: none;
}

/* ===== 虚拟摇杆 ===== */
#joystick-zone {
  position: absolute;
  left: 24px; bottom: 24px;
  width: 130px; height: 130px;
  z-index: 50;
  display: none;
  touch-action: none;
}
#joystick-base {
  position: absolute; inset: 0;
  border: 2px solid rgba(141,147,144,0.3);
  border-radius: 50%;
  background: rgba(141,147,144,0.05);
}
#joystick-thumb {
  position: absolute;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: rgba(0,246,255,0.2);
  border: 2px solid rgba(0,246,255,0.4);
  top: 39px; left: 39px;
  transition: none;
}

/* ===== 跳跃按钮 ===== */
#jump-btn {
  position: absolute;
  right: 30px; bottom: 30px;
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 2px solid rgba(0,246,255,0.3);
  background: rgba(0,246,255,0.08);
  color: #FFFFFF;
  font-size: 22px; font-weight: 700;
  display: none;
  align-items: center; justify-content: center;
  z-index: 50;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#jump-btn:active {
  background: rgba(0,246,255,0.2);
  border-color: rgba(0,246,255,0.6);
}

/* ===== 游戏UI ===== */
#game-ui {
  position: absolute; inset: 0;
  z-index: 40;
  pointer-events: none;
  display: none;
}
#game-ui .top-bar {
  position: absolute; top: 16px; left: 16px;
  display: flex; gap: 12px;
}
#game-ui .top-bar .ui-btn {
  padding: 6px 14px;
  background: rgba(18,18,18,0.8);
  border: 1px solid #707070;
  color: #FFFFFF;
  font-size: 13px;
  pointer-events: auto;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 4px;
}
#game-ui .top-bar .ui-btn:hover {
  border-color: #A0DAF7;
  background: rgba(0,161,255,0.1);
}
#level-name-display {
  position: absolute; top: 16px;
  left: 50%; transform: translateX(-50%);
  font-size: 16px; color: #8D9390;
  letter-spacing: 2px;
}

/* ===== 过关弹窗 ===== */
#win-modal {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 60;
  background: rgba(18,18,18,0.9);
}
#win-modal h2 {
  font-size: 40px; letter-spacing: 8px;
  margin-bottom: 20px;
  color: #F4F9A7;
  text-shadow: 0 0 30px rgba(244,249,167,0.4);
}
#win-modal p { color: #8D9390; margin-bottom: 30px; }

/* ===== 分享弹窗 ===== */
#share-modal {
  position: absolute; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 70;
  background: rgba(18,18,18,0.95);
}
#share-modal h3 { font-size: 24px; margin-bottom: 20px; color: #DFC8F5; }
#share-modal textarea {
  width: 320px; height: 80px;
  background: #1a1a1a; border: 1px solid #707070;
  color: #B3F4A8; padding: 10px;
  font-family: monospace; font-size: 12px;
  resize: none; margin-bottom: 16px;
  border-radius: 4px;
}
#share-modal .btn { margin: 4px; }

/* ===== 通用 ===== */
.hidden { display: none !important; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #121212; }
::-webkit-scrollbar-thumb { background: #707070; border-radius: 3px; }
</style>

</head>
<body>
<div id="game-container">
  <!-- 开始界面 -->
  <div id="start-screen">
    <div class="title">时空跃动</div>
    <div class="subtitle">SPACE TIME LEAP</div>
    <button class="btn" id="btn-start-game" style="margin-bottom:12px;">开始</button>
    <div class="btn-row">
      <button class="btn" id="btn-editor" style="font-size:14px;padding:10px 28px;">关卡编辑器</button>
      <button class="btn" id="btn-lobby" style="font-size:14px;padding:10px 28px;">大厅</button>
    </div>
  </div>

  <!-- 关卡选择界面 -->
  <div id="level-select-screen" style="display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;z-index:110;background:#121212;">
    <div style="font-size:28px;font-weight:900;letter-spacing:6px;margin-bottom:8px;color:#FFFFFF;">选择关卡</div>
    <div style="font-size:12px;color:#8D9390;letter-spacing:3px;margin-bottom:60px;">SELECT LEVEL</div>
    <div id="level-cards" style="display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:60px;">
      <div class="lvl-card" id="lvl-0">
        <span class="lvl-num">1</span>
        <span class="lvl-info">

      </div>
      <div class="lvl-card" id="lvl-1">
        <span class="lvl-num">2</span>
        <span class="lvl-info">
          <span class="lvl-name">尖刺走廊</span>
          <span class="lvl-tag">进阶</span>
        </span>
      </div>
      <div class="lvl-card" id="lvl-2">
        <span class="lvl-num">3</span>
        <span class="lvl-info">

      <button class="btn" id="btn-share-level" style="font-size:12px;padding:6px 16px;">分享到大厅</button>

  <!-- 游戏画布 -->
  <canvas id="game-canvas"></canvas>

  <!-- 虚拟摇杆 -->

  <!-- 分享弹窗 -->
  <div id="share-modal">
    <h3>分享关卡</h3>
    <textarea id="share-code-display" readonly></textarea>
    <div class="btn-row">
      <button class="btn" id="btn-share-copy">复制编码</button>
      <button class="btn" id="btn-share-close">关闭</button>
    </div>
  </div>

</div>

<script>

// ==================== Supabase 客户端 ====================
const SUPABASE_URL = 'https://cfwkkexvbxpbtxnrgzqg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_K1m62ACFX6tf6DpH6vO8Xw_z0BXtkRV';

// 使用 Supabase 官方客户端（推荐方式）
let supabaseClient = null;
function getSupabase() {
  if (!supabaseClient) {
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });
  }
  return supabaseClient;
}

async function supabaseGet(table, params) {
  try {
    const sb = getSupabase();
    let query = sb.from(table).select(params && params.select ? params.select : '*');
    // 处理过滤条件
    if (params) {
      Object.entries(params).forEach(([k, v]) => {
        if (k === 'select' || k === 'order' || k === 'limit') return;
        if (typeof v === 'string' && v.startsWith('eq.')) {
          query = query.eq(k, v.slice(3));
        }
      });
    }
    if (params && params.order) {
      const [col, dir] = params.order.split('.');
      query = query.order(col, { ascending: dir !== 'desc' });
    }
    if (params && params.limit) {
      query = query.limit(parseInt(params.limit));
    }
    const { data, error } = await query;
    if (error) throw error;
    return data || [];
  } catch (e) {
    console.error('Supabase GET 失败:', e);
    throw new Error('获取数据失败: ' + (e.message || '网络错误'));
  }
}

async function supabasePost(table, data) {
  try {
    const sb = getSupabase();
    const { error } = await sb.from(table).insert(data);
    if (error) throw error;
    return [];
  } catch (e) {
    console.error('Supabase POST 失败:', e);
    throw new Error('保存数据失败: ' + (e.message || '网络错误'));
  }
}

// ==================== 粒子系统 ====================
let particles = [];
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,

      decay: 0.02 + Math.random() * 0.03,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

// ==================== 关卡解析 ====================
function parseLevel(levelData) {
  // All coords are relative to spawn. Spawn is at (0,0) in the level data.
  // We place them in a 200x200 grid with spawn at (100,100)
  let offset = 100;
  let level = {
    w: 200, h: 200,
    offsetX: offset, offsetY: offset,
    grid: [],
    spawn: {x: offset, y: offset},
    portal: levelData.portal ? {x: levelData.portal.x + offset, y: levelData.portal.y + offset} : {x: offset + 10, y: offset},
    lands: levelData.lands || [],
    spikes: levelData.spikes || []
  };
  for (let y = 0; y < level.h; y++) {
    level.grid[y] = [];
    for (let x = 0; x < level.w; x++) {
      level.grid[y][x] = 0;
    }
  }
  // Place lands
  for (let l of level.lands) {
    for (let dy = 0; dy < l.h; dy++) {
      for (let dx = 0; dx < l.w; dx++) {
        let gy = l.y + dy + offset, gx = l.x + dx + offset;
        if (gy >= 0 && gy < level.h && gx >= 0 && gx < level.w) {
          level.grid[gy][gx] = TILE_LAND;
        }
      }
    }
  }
  // Place spikes
  for (let s of level.spikes) {
    let gy = s.y + offset, gx = s.x + offset;
    if (gy >= 0 && gy < level.h && gx >= 0 && gx < level.w) {
      level.grid[gy][gx] = TILE_SPIKE;
    }
  }
  // Place portal
  if (levelData.portal) {
    let py = levelData.portal.y + offset, px = levelData.portal.x + offset;
    if (py >= 0 && py < level.h && px >= 0 && px < level.w) {
      level.grid[py][px] = TILE_PORTAL;
    }
  }
  // Place spawn marker
  level.grid[offset][offset] = TILE_SPAWN;
  return level;
}

function loadLevel(idx) {

function resetPlayer() {
  let spawnX = currentLevel.spawn.x;
  let spawnY = currentLevel.spawn.y;
  player.x = spawnX * GRID_SIZE + 4;
  player.y = spawnY * GRID_SIZE + 4;
  player.vx = 0; player.vy = 0;
  player.onGround = false;
  player.dead = false;
  player.won = false;
  player.jumpCount = 0;
  particles = [];
}

// ==================== 物理更新 ====================
function updatePhysics() {
  if (player.dead || player.won) return;

  let moveX = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'] || joystick.dx < -0.3) {
    moveX = -PLAYER_SPEED;
    player.facing = -1;
  }
  if (keys['ArrowRight'] || keys['d'] || keys['D'] || joystick.dx > 0.3) {
    moveX = PLAYER_SPEED;
    player.facing = 1;
  }
  player.vx = moveX;

  if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' '] || jumpPressed) && player.jumpCount < player.maxJumps) {
    player.vy = JUMP_FORCE;
    player.jumpCount++;
    player.onGround = false;
    jumpPressed = false;
    let color = player.jumpCount === 1 ? '#FFFFFF' : '#F4F9A7';
    spawnParticles(player.x + player.w/2, player.y + player.h, color, 6);
  }

  player.vy += GRAVITY;
  player.vx *= FRICTION;

  movePlayer(player.vx, 0);
  movePlayer(0, player.vy);

  let px = Math.floor((player.x + player.w/2) / GRID_SIZE);
  let py = Math.floor((player.y + player.h/2) / GRID_SIZE);
  let portalX = currentLevel.portal.x;
  let portalY = currentLevel.portal.y;
  if (px === portalX && py === portalY) {
    player.won = true;
    spawnParticles(player.x + player.w/2, player.y + player.h/2, '#F4F9A7', 30);
    setTimeout(() => {
      const nextBtn = document.getElementById('btn-next-level');
      const backBtn = document.getElementById('btn-back-menu');
      if (isEditorTest) {
        nextBtn.textContent = '再测一次';
        backBtn.textContent = '返回编辑器';
      } else if (isFromLobby) {
        nextBtn.textContent = '再玩一次';
        backBtn.textContent = '返回大厅';
      } else if (isCustomLevel || currentLevelIdx >= BUILTIN_LEVELS.length - 1) {
        nextBtn.textContent = '返回菜单';
        backBtn.textContent = '返回菜单';
      } else {
        nextBtn.textContent = '下一关';
        backBtn.textContent = '返回菜单';
      }
      document.getElementById('win-modal').style.display = 'flex';
    }, 500);
  }

  // Death boundary: 10 tiles below spawn (spawn is at offset, so relative Y = -10 means offset - 10)
  let spawnRelY = currentLevel.spawn.y;
  if (player.y > (spawnRelY + 10) * GRID_SIZE) {
    playerDies();
  }

  let targetCamX = player.x - canvasW / 2 + player.w / 2;
  let targetCamY = player.y - canvasH / 2 + player.h / 2;
  camera.x += (targetCamX - camera.x) * 0.1;
  camera.y += (targetCamY - camera.y) * 0.1;
}

function movePlayer(dx, dy) {
  player.x += dx;
  player.y += dy;

  let offX = currentLevel.offsetX || 0, offY = currentLevel.offsetY || 0;
  let left = Math.floor(player.x / GRID_SIZE);
  let right = Math.floor((player.x + player.w - 0.1) / GRID_SIZE);
  let top = Math.floor(player.y / GRID_SIZE);
  let bottom = Math.floor((player.y + player.h - 0.1) / GRID_SIZE);

  for (let gy = top; gy <= bottom; gy++) {
    for (let gx = left; gx <= right; gx++) {
      let gridX = gx, gridY = gy;
      if (gridY < 0 || gridY >= currentLevel.h || gridX < 0 || gridX >= currentLevel.w) continue;
      let tile = currentLevel.grid[gridY][gridX];
      if (tile === TILE_LAND) {
        let tileX = gx * GRID_SIZE;
        let tileY = gy * GRID_SIZE;
        if (player.x < tileX + GRID_SIZE && player.x + player.w > tileX &&
            player.y < tileY + GRID_SIZE && player.y + player.h > tileY) {
          if (dy > 0) {
            player.y = tileY - player.h;
            player.vy = 0;
            player.onGround = true;
            player.jumpCount = 0;
          } else if (dy < 0) {
            player.y = tileY + GRID_SIZE;
            player.vy = 0;
          } else if (dx > 0) {
            player.x = tileX - player.w;
            player.vx = 0;
          } else if (dx < 0) {
            player.x = tileX + GRID_SIZE;
            player.vx = 0;
          }
        }
      } else if (tile === TILE_SPIKE) {
        let tileX = gx * GRID_SIZE;
        let tileY = gy * GRID_SIZE;
        let px = player.x + player.w/2;
        let py = player.y + player.h/2;
        let ax = tileX + GRID_SIZE/2, ay = tileY + 4;
        let bx = tileX + GRID_SIZE - 4, by = tileY + GRID_SIZE - 4;
        let cx = tileX + 4, cy = tileY + GRID_SIZE - 4;
        let denom = (by - cy)*(ax - cx) + (cx - bx)*(ay - cy);
        let a = ((by - cy)*(px - cx) + (cx - bx)*(py - cy)) / denom;
        let b = ((cy - ay)*(px - cx) + (ax - cx)*(py - cy)) / denom;
        let c = 1 - a - b;
        if (a >= 0 && b >= 0 && c >= 0) {
          playerDies();
        }
      }
    }
  }
}

function playerDies() {
  if (player.dead) return;
  player.dead = true;
  spawnParticles(player.x + player.w/2, player.y + player.h/2, '#FFD1D4', 20);
  setTimeout(() => {
    resetPlayer();
  }, 800);
}

// ==================== 渲染 ====================
let time = 0;
function render() {
  time += 0.016;
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, canvasW, canvasH);

  if (!currentLevel) return;

  ctx.save();
  ctx.translate(-Math.floor(camera.x), -Math.floor(camera.y));

  let startX = Math.floor(camera.x / GRID_SIZE);
  let endX = Math.ceil((camera.x + canvasW) / GRID_SIZE);
  let startY = Math.floor(camera.y / GRID_SIZE);
  let endY = Math.ceil((camera.y + canvasH) / GRID_SIZE);
  let offX = currentLevel.offsetX || 0, offY = currentLevel.offsetY || 0;

  for (let y = startY; y <= endY; y++) {
    for (let x = startX; x <= endX; x++) {
      let gx = x, gy = y;
      if (gy < 0 || gy >= currentLevel.h || gx < 0 || gx >= currentLevel.w) continue;
      let tile = currentLevel.grid[gy][gx];
      let tx = x * GRID_SIZE;
      let ty = y * GRID_SIZE;

      if (tile === TILE_LAND) {
        ctx.fillStyle = COLORS.land;
        ctx.fillRect(tx, ty, GRID_SIZE, GRID_SIZE);
        ctx.strokeStyle = 'rgba(18,18,18,0.3)';
        ctx.lineWidth = 1;
        let hasLeft = x > 0 && currentLevel.grid[y][x-1] === TILE_LAND;
        let hasRight = x < currentLevel.w-1 && currentLevel.grid[y][x+1] === TILE_LAND;
        let hasUp = y > 0 && currentLevel.grid[y-1][x] === TILE_LAND;
        let hasDown = y < currentLevel.h-1 && currentLevel.grid[y+1][x] === TILE_LAND;
        ctx.beginPath();
        if (!hasLeft) { ctx.moveTo(tx+0.5, ty); ctx.lineTo(tx+0.5, ty+GRID_SIZE); }
        if (!hasRight) { ctx.moveTo(tx+GRID_SIZE-0.5, ty); ctx.lineTo(tx+GRID_SIZE-0.5, ty+GRID_SIZE); }
        if (!hasUp) { ctx.moveTo(tx, ty+0.5); ctx.lineTo(tx+GRID_SIZE, ty+0.5); }
        if (!hasDown) { ctx.moveTo(tx, ty+GRID_SIZE-0.5); ctx.lineTo(tx+GRID_SIZE, ty+GRID_SIZE-0.5); }
        ctx.stroke();
      } else if (tile === TILE_SPIKE) {
        ctx.fillStyle = COLORS.spike;
        ctx.beginPath();
        ctx.moveTo(tx + GRID_SIZE/2, ty + 2);
        ctx.lineTo(tx + GRID_SIZE - 2, ty + GRID_SIZE - 2);
        ctx.lineTo(tx + 2, ty + GRID_SIZE - 2);
        ctx.closePath();
        ctx.fill();
      } else if (tile === TILE_PORTAL) {
        let pulse = Math.sin(time * 3) * 0.3 + 0.7;
        ctx.fillStyle = `rgba(244, 249, 167, ${pulse})`;
        ctx.fillRect(tx + 2, ty + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        ctx.strokeStyle = '#F4F9A7';
        ctx.lineWidth = 2;
        ctx.strokeRect(tx + 2, ty + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        if (Math.random() < 0.1) {
          spawnParticles(tx + GRID_SIZE/2, ty + GRID_SIZE/2, '#F4F9A7', 1);
        }
      } else if (tile === TILE_SPAWN) {
        ctx.fillStyle = 'rgba(179,244,168,0.3)';
        ctx.fillRect(tx + 2, ty + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        ctx.strokeStyle = '#B3F4A8';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(tx + 2, ty + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        ctx.setLineDash([]);
      }
    }
  }

  if (!player.dead) {
    let glowSize = 15 + Math.sin(time * 4) * 5;
    let gradient = ctx.createRadialGradient(
      player.x + player.w/2, player.y + player.h/2, 0,
      player.x + player.w/2, player.y + player.h/2, glowSize
    );
    gradient.addColorStop(0, 'rgba(0,246,255,0.6)');
    gradient.addColorStop(1, 'rgba(0,246,255,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(player.x - glowSize + player.w/2, player.y - glowSize + player.h/2, glowSize*2, glowSize*2);

    ctx.fillStyle = COLORS.player;
    ctx.shadowColor = '#00F6FF';
    ctx.shadowBlur = 15;
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.shadowBlur = 0;
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ==================== 游戏循环 ====================
function gameLoop() {
  if (gameState === 'playing') {
    updatePhysics();
    render();
  }
  requestAnimationFrame(gameLoop);
}
gameLoop();

// ==================== 虚拟摇杆 ====================
const joystickZone = document.getElementById('joystick-zone');
const joystickThumb = document.getElementById('joystick-thumb');
let joystickTouchId = null;

function initJoystick() {
  const zone = joystickZone;
  const thumb = joystickThumb;
  const maxDist = 48;
  const deadZone = 0.08;
  let centerX = 0, centerY = 0;

  function onStart(clientX, clientY, id) {
    if (joystickTouchId !== null) return;
    if (clientX > window.innerWidth / 2) return;
    const rect = zone.getBoundingClientRect();
    centerX = rect.left + rect.width / 2;
    centerY = rect.top + rect.height / 2;
    joystickTouchId = id;
    update(clientX, clientY);
  }

  function onMove(clientX, clientY) {
    if (joystickTouchId === null) return;
    if (clientX > window.innerWidth / 2) return;
    update(clientX, clientY);
  }

  function onEnd() {
    if (joystickTouchId === null) return;
    joystickTouchId = null;
    joystick.active = false;
    joystick.dx = 0;
    joystick.dy = 0;
    thumb.style.transform = 'translate(0px, 0px)';
    thumb.style.transition = 'transform 0.1s ease-out';
    setTimeout(() => { thumb.style.transition = 'none'; }, 100);
  }

  function update(cx, cy) {
    let dx = cx - centerX;
    let dy = cy - centerY;
    let dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
    }
    thumb.style.transform = `translate(${dx}px, ${dy}px)`;

    let nx = dx / maxDist;
    let ny = dy / maxDist;
    let len = Math.sqrt(nx * nx + ny * ny);
    if (len < deadZone) {
      joystick.dx = 0;
      joystick.dy = 0;
      joystick.active = false;
    } else {
      let scale = (len - deadZone) / (1 - deadZone);
      joystick.dx = (nx / len) * scale;
      joystick.dy = (ny / len) * scale;
      joystick.active = true;
    }
  }

  zone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length > 0) onStart(e.touches[0].clientX, e.touches[0].clientY, e.touches[0].identifier);
  }, { passive: false });

  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    let found = false;
    for (let t of e.touches) {
      if (t.identifier === joystickTouchId) {
        onMove(t.clientX, t.clientY);
        found = true;
        break;
      }
    }
    if (!found && joystickTouchId !== null) onEnd();  // 追踪的触摸丢失，强制复位
  }, { passive: false });

  zone.addEventListener('touchend', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
      if (t.identifier === joystickTouchId) { onEnd(); break; }
    }
  });

  zone.addEventListener('touchcancel', e => {
    for (let t of e.changedTouches) {
      if (t.identifier === joystickTouchId) { onEnd(); break; }
    }
  });

  let mouseDown = false;
  zone.addEventListener('mousedown', e => {
    e.preventDefault();
    mouseDown = true;
    onStart(e.clientX, e.clientY, -1);
  });
  document.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    onMove(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', e => {
    if (!mouseDown) return;
    mouseDown = false;
    onEnd();
  });
}
initJoystick();

  function onJumpStart(e) {
    e.preventDefault();

    if (clientX < window.innerWidth / 2) return;
    jumpPressed = true;
    jumpBtn.style.background = 'rgba(0,246,255,0.2)';
  }
  function onJumpEnd(e) {
    e.preventDefault();

  }
  jumpBtn.addEventListener('touchstart', onJumpStart, { passive: false });

  jumpBtn.addEventListener('mousedown', onJumpStart);
  jumpBtn.addEventListener('mouseup', onJumpEnd);
  jumpBtn.addEventListener('mouseleave', onJumpEnd);
}

// ==================== 关卡编辑器 ====================
const editorCanvas = document.getElementById('editor-canvas');
const editorCtx = editorCanvas.getContext('2d');

function initEditor() {
  editorCells.clear();
  editorSpawn = { x: 2, y: 10 };
  editorPortal = { x: 20, y: 10 };
  editorViewX = 0;
  editorViewY = 0;
  editorZoom = 1;
  isPanning = false;
  isDrawing = false;
  updateEditorCoords();
  renderEditor();
}

function updateEditorCoords() {
  const el = document.getElementById('editor-coords');
  if (el) {
    el.textContent = `X:${Math.round(editorViewX)} Y:${Math.round(editorViewY)} | ${Math.round(editorZoom * 100)}%`;
  }
}

function renderEditor() {
  const ectx = editorCtx;
  const w = editorCanvas.width;
  const h = editorCanvas.height;
  const cs = EDITOR_CELL_SIZE * editorZoom;

  ectx.fillStyle = '#121212';
  ectx.fillRect(0, 0, w, h);

  ectx.save();
  ectx.translate(w/2 - editorViewX * cs, h/2 - editorViewY * cs);

  let startX = Math.floor((editorViewX * cs - w/2) / cs) - 1;
  let endX = Math.ceil((editorViewX * cs + w/2) / cs) + 1;
  let startY = Math.floor((editorViewY * cs - h/2) / cs) - 1;
  let endY = Math.ceil((editorViewY * cs + h/2) / cs) + 1;

  ectx.strokeStyle = '#1a1a1a';
  ectx.lineWidth = 1;
  for (let x = startX; x <= endX; x++) {
    ectx.beginPath();
    ectx.moveTo(x * cs, startY * cs);
    ectx.lineTo(x * cs, endY * cs);
    ectx.stroke();
  }
  for (let y = startY; y <= endY; y++) {
    ectx.beginPath();
    ectx.moveTo(startX * cs, y * cs);
    ectx.lineTo(endX * cs, y * cs);
    ectx.stroke();
  }

  for (let [key, tile] of editorCells) {
    let [gx, gy] = key.split(',').map(Number);
    let tx = gx * cs;
    let ty = gy * cs;
    if (tx + cs < -w/2 + editorViewX * cs || tx > w/2 + editorViewX * cs ||
        ty + cs < -h/2 + editorViewY * cs || ty > h/2 + editorViewY * cs) continue;

    if (tile === TILE_LAND) {
      ectx.fillStyle = '#E1E3E6';
      ectx.fillRect(tx + 1, ty + 1, cs - 2, cs - 2);
      let hasLeft = editorCells.has((gx-1)+','+gy);
      let hasRight = editorCells.has((gx+1)+','+gy);
      let hasUp = editorCells.has(gx+','+(gy-1));
      let hasDown = editorCells.has(gx+','+(gy+1));
      ectx.strokeStyle = 'rgba(18,18,18,0.3)';
      ectx.lineWidth = 1;
      ectx.beginPath();
      if (!hasLeft) { ectx.moveTo(tx+0.5, ty); ectx.lineTo(tx+0.5, ty+cs); }
      if (!hasRight) { ectx.moveTo(tx+cs-0.5, ty); ectx.lineTo(tx+cs-0.5, ty+cs); }
      if (!hasUp) { ectx.moveTo(tx, ty+0.5); ectx.lineTo(tx+cs, ty+0.5); }
      if (!hasDown) { ectx.moveTo(tx, ty+cs-0.5); ectx.lineTo(tx+cs, ty+cs-0.5); }
      ectx.stroke();
    } else if (tile === TILE_SPIKE) {
      ectx.fillStyle = '#FFD1D4';
      ectx.beginPath();
      ectx.moveTo(tx + cs/2, ty + 2);
      ectx.lineTo(tx + cs - 2, ty + cs - 2);
      ectx.lineTo(tx + 2, ty + cs - 2);
      ectx.closePath();
      ectx.fill();
    } else if (tile === TILE_PORTAL) {
      ectx.fillStyle = '#F4F9A7';
      ectx.fillRect(tx + 2, ty + 2, cs - 4, cs - 4);
      ectx.strokeStyle = '#F4F9A7';
      ectx.strokeRect(tx + 2, ty + 2, cs - 4, cs - 4);
    } else if (tile === TILE_SPAWN) {
      ectx.fillStyle = 'rgba(179,244,168,0.3)';
      ectx.fillRect(tx + 2, ty + 2, cs - 4, cs - 4);
      ectx.strokeStyle = '#B3F4A8';
      ectx.setLineDash([3, 3]);
      ectx.strokeRect(tx + 2, ty + 2, cs - 4, cs - 4);
      ectx.setLineDash([]);
    }
  }

  if (editorCurrentLand && editorTool === 'land') {
    ectx.fillStyle = 'rgba(224,227,230,0.5)';
    ectx.fillRect(
      editorCurrentLand.x * cs,
      editorCurrentLand.y * cs,
      editorCurrentLand.w * cs,
      editorCurrentLand.h * cs
    );
  }

  ectx.restore();
}

function getEditorCell(clientX, clientY) {
  const rect = editorCanvas.getBoundingClientRect();
  const scaleX = editorCanvas.width / rect.width;
  const scaleY = editorCanvas.height / rect.height;
  const x = (clientX - rect.left) * scaleX;
  const y = (clientY - rect.top) * scaleY;
  const cs = EDITOR_CELL_SIZE * editorZoom;
  const w = editorCanvas.width;
  const h = editorCanvas.height;
  const worldX = (x - w/2) / cs + editorViewX;
  const worldY = (y - h/2) / cs + editorViewY;
  return {
    x: Math.floor(worldX),
    y: Math.floor(worldY)
  };
}

function setEditorCell(gx, gy, tool) {
  let key = gx + ',' + gy;
  if (tool === 'land') {
    editorCells.set(key, TILE_LAND);
  } else if (tool === 'spike') {
    editorCells.set(key, TILE_SPIKE);
  } else if (tool === 'portal') {
    for (let [k, v] of editorCells) {
      if (v === TILE_PORTAL) editorCells.delete(k);
    }
    editorCells.set(key, TILE_PORTAL);
    editorPortal = { x: gx, y: gy };
  } else if (tool === 'spawn') {
    for (let [k, v] of editorCells) {
      if (v === TILE_SPAWN) editorCells.delete(k);
    }
    editorCells.set(key, TILE_SPAWN);
    editorSpawn = { x: gx, y: gy };
  } else if (tool === 'eraser') {
    editorCells.delete(key);
  }
}

// 编辑器鼠标/触摸事件 - 支持拖拽平移和双指缩放
editorCanvas.addEventListener('mousedown', e => {
  if (e.button === 1 || e.button === 2 || e.shiftKey) {
    // 中键/右键/Shift+左键 = 平移
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panViewStartX = editorViewX;
    panViewStartY = editorViewY;
    editorCanvas.style.cursor = 'grabbing';
    e.preventDefault();
    return;
  }
  // 左键 = 绘制
  isDrawing = true;
  const cell = getEditorCell(e.clientX, e.clientY);
  drawStart = cell;
  if (editorTool === 'land') {
    editorCurrentLand = { x: cell.x, y: cell.y, w: 1, h: 1 };
  } else {
    setEditorCell(cell.x, cell.y, editorTool);
  }
  renderEditor();
});

editorCanvas.addEventListener('mousemove', e => {
  if (isPanning) {
    const rect = editorCanvas.getBoundingClientRect();
    const scaleX = editorCanvas.width / rect.width;
    const scaleY = editorCanvas.height / rect.height;
    const cs = EDITOR_CELL_SIZE * editorZoom;
    editorViewX = panViewStartX - (e.clientX - panStartX) * scaleX / cs;
    editorViewY = panViewStartY - (e.clientY - panStartY) * scaleY / cs;
    updateEditorCoords();
    renderEditor();
    return;
  }
  if (!isDrawing) return;
  const cell = getEditorCell(e.clientX, e.clientY);
  if (editorTool === 'land' && drawStart) {
    let x1 = Math.min(drawStart.x, cell.x);
    let y1 = Math.min(drawStart.y, cell.y);
    let x2 = Math.max(drawStart.x, cell.x);
    let y2 = Math.max(drawStart.y, cell.y);
    editorCurrentLand = { x: x1, y: y1, w: x2 - x1 + 1, h: y2 - y1 + 1 };
  } else {
    setEditorCell(cell.x, cell.y, editorTool);
  }
  renderEditor();
});

editorCanvas.addEventListener('mouseup', e => {
  if (isPanning) {
    isPanning = false;
    editorCanvas.style.cursor = 'grab';
    return;
  }
  if (!isDrawing) return;
  isDrawing = false;
  if (editorTool === 'land' && editorCurrentLand) {
    for (let dy = 0; dy < editorCurrentLand.h; dy++) {
      for (let dx = 0; dx < editorCurrentLand.w; dx++) {
        let gx = editorCurrentLand.x + dx;
        let gy = editorCurrentLand.y + dy;
        editorCells.set(gx + ',' + gy, TILE_LAND);
      }
    }
    editorCurrentLand = null;
  }
  drawStart = null;
  renderEditor();
});

editorCanvas.addEventListener('mouseleave', () => {
  isDrawing = false;
  isPanning = false;
  editorCanvas.style.cursor = 'grab';
  editorCurrentLand = null;
  drawStart = null;
});

editorCanvas.addEventListener('contextmenu', e => {
  e.preventDefault();
});

editorCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = editorCanvas.getBoundingClientRect();
  const scaleX = editorCanvas.width / rect.width;
  const scaleY = editorCanvas.height / rect.height;
  const cs = EDITOR_CELL_SIZE * editorZoom;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const worldX = (mx - editorCanvas.width/2) / cs + editorViewX;
  const worldY = (my - editorCanvas.height/2) / cs + editorViewY;

  const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
  const newZoom = Math.max(0.25, Math.min(4, editorZoom * zoomFactor));

  const newCs = EDITOR_CELL_SIZE * newZoom;
  editorViewX = worldX - (mx - editorCanvas.width/2) / newCs;
  editorViewY = worldY - (my - editorCanvas.height/2) / newCs;
  editorZoom = newZoom;

  updateEditorCoords();
  renderEditor();
}, { passive: false });

// 触摸支持 - 单指绘制，双指缩放，双指移动平移
let touchMode = 'none'; // 'none', 'draw', 'pan', 'pinch'
let touchStartDist = 0;
let touchStartZoom = 1;
let touchStartViewX = 0, touchStartViewY = 0;
let touchStartMidX = 0, touchStartMidY = 0;

editorCanvas.addEventListener('touchstart', e => {
  e.preventDefault();

  if (e.touches.length === 2) {
    // 双指 = 缩放/平移
    touchMode = 'pinch';
    const t1 = e.touches[0], t2 = e.touches[1];
    touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    touchStartZoom = editorZoom;
    touchStartViewX = editorViewX;
    touchStartViewY = editorViewY;
    touchStartMidX = (t1.clientX + t2.clientX) / 2;
    touchStartMidY = (t1.clientY + t2.clientY) / 2;
    isDrawing = false;
    editorCurrentLand = null;
    drawStart = null;
    return;
  }

  if (e.touches.length === 1) {
    const touch = e.touches[0];
    const cell = getEditorCell(touch.clientX, touch.clientY);

    // 检查是否触摸在已有内容上（可以改为平移）
    // 简单判断：如果工具是橡皮擦或触摸位置有内容，则平移
    const key = cell.x + ',' + cell.y;
    if (editorTool === 'eraser' || editorCells.has(key)) {
      // 长按时平移，这里简化为：如果触摸位置有内容且工具不是绘制工具，则平移
      // 实际上移动端用单指长按来平移比较复杂，这里用另一种方式：
      // 如果工具是橡皮擦，则进入平移模式（因为橡皮擦不需要连续绘制）
      if (editorTool === 'eraser') {
        touchMode = 'pan';
        panStartX = touch.clientX;
        panStartY = touch.clientY;
        panViewStartX = editorViewX;
        panViewStartY = editorViewY;
        return;
      }
    }

    touchMode = 'draw';
    isDrawing = true;
    drawStart = cell;
    if (editorTool === 'land') {
      editorCurrentLand = { x: cell.x, y: cell.y, w: 1, h: 1 };
    } else {
      setEditorCell(cell.x, cell.y, editorTool);
    }
    renderEditor();
  }
}, { passive: false });

editorCanvas.addEventListener('touchmove', e => {
  e.preventDefault();

  if (e.touches.length === 2 && touchMode === 'pinch') {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const midX = (t1.clientX + t2.clientX) / 2;
    const midY = (t1.clientY + t2.clientY) / 2;

    const rect = editorCanvas.getBoundingClientRect();
    const scaleX = editorCanvas.width / rect.width;
    const scaleY = editorCanvas.height / rect.height;

    // 缩放
    const newZoom = Math.max(0.25, Math.min(4, touchStartZoom * (dist / touchStartDist)));
    const cs = EDITOR_CELL_SIZE * touchStartZoom;
    const newCs = EDITOR_CELL_SIZE * newZoom;

    // 以双指中心为锚点缩放
    const worldMidX = (touchStartMidX - rect.left) * scaleX;
    const worldMidY = (touchStartMidY - rect.top) * scaleY;
    const anchorWorldX = (worldMidX - editorCanvas.width/2) / cs + touchStartViewX;
    const anchorWorldY = (worldMidY - editorCanvas.height/2) / cs + touchStartViewY;

    editorViewX = anchorWorldX - (worldMidX - editorCanvas.width/2) / newCs;
    editorViewY = anchorWorldY - (worldMidY - editorCanvas.height/2) / newCs;

    // 双指平移
    editorViewX += (touchStartMidX - midX) * scaleX / newCs;
    editorViewY += (touchStartMidY - midY) * scaleY / newCs;

    editorZoom = newZoom;
    updateEditorCoords();
    renderEditor();
    return;
  }

  if (e.touches.length === 1) {
    const touch = e.touches[0];

    if (touchMode === 'pan') {
      const rect = editorCanvas.getBoundingClientRect();
      const scaleX = editorCanvas.width / rect.width;
      const scaleY = editorCanvas.height / rect.height;
      const cs = EDITOR_CELL_SIZE * editorZoom;
      editorViewX = panViewStartX - (touch.clientX - panStartX) * scaleX / cs;
      editorViewY = panViewStartY - (touch.clientY - panStartY) * scaleY / cs;
      updateEditorCoords();
      renderEditor();
      return;
    }

    if (touchMode === 'draw' && isDrawing) {
      const cell = getEditorCell(touch.clientX, touch.clientY);
      if (editorTool === 'land' && drawStart) {
        let x1 = Math.min(drawStart.x, cell.x);
        let y1 = Math.min(drawStart.y, cell.y);
        let x2 = Math.max(drawStart.x, cell.x);
        let y2 = Math.max(drawStart.y, cell.y);
        editorCurrentLand = { x: x1, y: y1, w: x2 - x1 + 1, h: y2 - y1 + 1 };
      } else {
        setEditorCell(cell.x, cell.y, editorTool);
      }
      renderEditor();
    }
  }
}, { passive: false });

editorCanvas.addEventListener('touchend', e => {
  e.preventDefault();

  if (e.touches.length === 0) {
    if (touchMode === 'draw' && isDrawing) {
      isDrawing = false;
      if (editorTool === 'land' && editorCurrentLand) {
        for (let dy = 0; dy < editorCurrentLand.h; dy++) {
          for (let dx = 0; dx < editorCurrentLand.w; dx++) {
            let gx = editorCurrentLand.x + dx;
            let gy = editorCurrentLand.y + dy;
            editorCells.set(gx + ',' + gy, TILE_LAND);
          }
        }
        editorCurrentLand = null;
      }
      drawStart = null;
      renderEditor();
    }
    touchMode = 'none';
  }
});

async function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  }
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(textarea);
  return ok;
}

document.getElementById('btn-copy-code').addEventListener('click', async () => {
  const code = document.getElementById('level-code-output').value;
  if (code) {
    const ok = await copyToClipboard(code);
    const btn = document.getElementById('btn-copy-code');
    const oldText = btn.textContent;
    btn.textContent = ok ? '已复制!' : '复制失败';
    setTimeout(() => btn.textContent = oldText, 1500);
  }
});

// ==================== 关卡编码/解码系统 ====================
const CODE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+-';

function encodeLevel() {
  let ox = editorSpawn.x, oy = editorSpawn.y;
  let landCoords = [], spikeCoords = [];
  let prx = editorPortal.x - ox, pry = editorPortal.y - oy;

  for (let [key, tile] of editorCells) {
    let [x, y] = key.split(',').map(Number);
    let rx = x - ox, ry = y - oy;
    if (tile === TILE_LAND) landCoords.push(`a(${rx},${ry})`);
    else if (tile === TILE_SPIKE) spikeCoords.push(`s(${rx},${ry})`);
  }

  const nameInput = document.getElementById('level-name-input');
  const levelName = nameInput && nameInput.value.trim() ? nameInput.value.trim() : '自定义';
  return ['4', prx, pry, levelName, landCoords.join(''), spikeCoords.join('')].join('.');
}

function decodeLevel(code) {
  try {
    let parts = code.split('.');
    let ver = parts[0];
    if (ver === '4') {
      let prx = parseInt(parts[1]), pry = parseInt(parts[2]);
      let nameEndIdx = 3;
      for (let i = 3; i < parts.length; i++) {
        let p = parts[i];
        if (p.startsWith('a(') || p.startsWith('s(') || p === '') {
          nameEndIdx = i; break;
        }
      }
      let name = parts.slice(3, nameEndIdx).join('.') || '自定义关卡';
      let remaining = parts.slice(nameEndIdx).join('.');
      let firstSpike = remaining.indexOf('s(');
      let landStr, spikeStr;
      if (firstSpike >= 0) {
        landStr = remaining.substring(0, firstSpike);
        if (landStr.endsWith('.')) landStr = landStr.slice(0, -1);
        spikeStr = remaining.substring(firstSpike);
      } else {
        landStr = remaining;
        spikeStr = '';
      }
      let lands = [], spikes = [];

      // Parse land coordinates: a(x,y)a(x,y)...
      let landMatch = landStr.match(/a\((-?\d+),(-?\d+)\)/g);
      if (landMatch) {
        let landSet = new Set();
        for (let m of landMatch) {
          let coords = m.match(/a\((-?\d+),(-?\d+)\)/);
          if (coords) landSet.add(coords[1] + ',' + coords[2]);
        }
        // Merge into rectangles
        let landGrid = new Map();
        for (let key of landSet) landGrid.set(key, 1);
        let processed = new Set();
        for (let key of landSet) {
          if (processed.has(key)) continue;
          let [x, y] = key.split(',').map(Number);
          // Expand width
          let w = 1;
          while (landGrid.has((x + w) + ',' + y)) w++;
          // Expand height
          let h = 1;
          let canExpandH = true;
          while (canExpandH) {
            for (let dx = 0; dx < w; dx++) {
              if (!landGrid.has((x + dx) + ',' + (y + h))) { canExpandH = false; break; }
            }
            if (canExpandH) h++;
          }
          // Mark processed
          for (let dy = 0; dy < h; dy++) {
            for (let dx = 0; dx < w; dx++) {
              processed.add((x + dx) + ',' + (y + dy));
            }
          }
          lands.push({x, y, w, h});
        }
      }

      // Parse spike coordinates: s(x,y)s(x,y)...
      let spikeMatch = spikeStr.match(/s\((-?\d+),(-?\d+)\)/g);
      if (spikeMatch) {
        for (let m of spikeMatch) {
          let coords = m.match(/s\((-?\d+),(-?\d+)\)/);
          if (coords) spikes.push({x: parseInt(coords[1]), y: parseInt(coords[2])});
        }
      }

      return {name, w: 100, h: 100, spawn: {x: 0, y: 0}, portal: {x: prx, y: pry}, lands, spikes};
    } else {
      return decodeLevelV1(code);
    }
  } catch (e) { console.error('解码失败:', e); return null; }
}

function decodeLevelV1(code) {
  try {
    let parts = code.split('.');
    if (parts.length < 9) return null;
    let w = parseInt(parts[1]), h = parseInt(parts[2]);
    let spawnX = parseInt(parts[3]), spawnY = parseInt(parts[4]);
    let portalX = parseInt(parts[5]), portalY = parseInt(parts[6]);
    let name = parts[7], encoded = parts[8];
    let gridData = [];
    for (let i = 0; i < encoded.length; i++) {
      let val = CODE_CHARS.indexOf(encoded[i]);
      if (val < 0) continue;
      let count = val >> 2, tile = val & 3;
      for (let j = 0; j < count; j++) gridData.push(tile);
    }
    let lands = [], spikes = [], idx = 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let tile = gridData[idx++] || 0;
        if (tile === TILE_LAND) {
          let found = false;
          for (let l of lands) { if (l.y === y && l.x + l.w === x) { l.w++; found = true; break; } }
          if (!found) lands.push({x, y, w: 1, h: 1});
        } else if (tile === TILE_SPIKE) spikes.push({x, y});
      }
    }
    return {name, w, h, spawn: {x: spawnX, y: spawnY}, portal: {x: portalX, y: portalY}, lands, spikes};
  } catch (e) { return null; }
}

function buildLevelFromEditor() {
  // ALL coordinates relative to spawn. Spawn is (0,0).
  let ox = editorSpawn.x, oy = editorSpawn.y;
  let lands = [], spikes = [];
  let grid = new Map();

  for (let [key, tile] of editorCells) {
    let [x, y] = key.split(',').map(Number);
    let rx = x - ox, ry = y - oy;
    if (tile === TILE_LAND) {
      grid.set(rx + ',' + ry, tile);
    } else if (tile === TILE_SPIKE) {
      spikes.push({x: rx, y: ry});
    }
  }

  // Scanline merge for lands (relative coords)
  let keys = Array.from(grid.keys()).map(k => k.split(',').map(Number));
  if (keys.length > 0) {
    let minY = Math.min(...keys.map(k => k[1]));
    let maxY = Math.max(...keys.map(k => k[1]));

    for (let y = minY; y <= maxY; y++) {
      let rowKeys = keys.filter(k => k[1] === y).map(k => k[0]).sort((a,b) => a-b);
      if (rowKeys.length === 0) continue;
      let startX = rowKeys[0], w = 1;
      for (let i = 1; i < rowKeys.length; i++) {
        if (rowKeys[i] === startX + w) { w++; }
        else {
          lands.push({x: startX, y, w, h: 1});
          startX = rowKeys[i]; w = 1;
        }
      }
      lands.push({x: startX, y, w, h: 1});
    }

    // Vertical merge
    let merged = true;
    while (merged) {
      merged = false;
      for (let i = 0; i < lands.length; i++) {
        for (let j = i + 1; j < lands.length; j++) {
          let a = lands[i], b = lands[j];
          if (a.x === b.x && a.w === b.w && a.y + a.h === b.y) {
            a.h += b.h;
            lands.splice(j, 1);
            merged = true;
            break;
          }
        }
        if (merged) break;
      }
    }
  }

  let prx = editorPortal.x - ox, pry = editorPortal.y - oy;

  const nameInput = document.getElementById('level-name-input');
  const levelName = nameInput && nameInput.value.trim() ? nameInput.value.trim() : '自定义关卡';
  return {
    name: levelName,
    w: 100, h: 100,
    spawn: {x: 0, y: 0},
    portal: {x: prx, y: pry},
    lands, spikes
  };
}

// ==================== 大厅系统 ====================
let currentUser = null;
let localLevels = [];

function initStorage() {
  let saved = localStorage.getItem('bwjump_levels');
  if (saved) { try { localLevels = JSON.parse(saved); } catch(e) {} }
  let user = localStorage.getItem('bwjump_user');
  if (user) { currentUser = JSON.parse(user); updateUserDisplay(); }
}

function saveLocalLevels() { localStorage.setItem('bwjump_levels', JSON.stringify(localLevels)); }

function updateUserDisplay() {
  const el = document.getElementById('user-display');
  el.textContent = currentUser ? '用户: ' + currentUser.username : '未登录';
}

function mockAuth(username, password, isRegister) {
  return new Promise((resolve, reject) => {
    setTimeout(() => {
      let users = JSON.parse(localStorage.getItem('bwjump_users') || '[]');
      if (isRegister) {
        if (users.find(u => u.username === username)) { reject('用户名已存在'); return; }
        let user = {username, password, id: Date.now()};
        users.push(user); localStorage.setItem('bwjump_users', JSON.stringify(users));
        resolve(user);
      } else {
        let user = users.find(u => u.username === username && u.password === password);
        if (user) resolve(user); else reject('用户名或密码错误');
      }
    }, 300);
  });
}

async function shareLevelToLobby(levelData, code) {
  try {
    const existing = await supabaseGet('levels', { code: `eq.${code}`, select: 'id', limit: 1 });
    if (existing && existing.length > 0) {
      throw new Error('该关卡已存在于大厅中');
    }
    await supabasePost('levels', {
      name: levelData.name || '未命名关卡',
      author: currentUser ? currentUser.username : '匿名',
      code: code,
      likes: 0
    });
    return true;
  } catch (e) {
    console.error('分享失败:', e);
    throw e;
  }
}

async function getSharedLevels() {
  try {
    return await supabaseGet('levels', { select: '*', order: 'created_at.desc' });
  } catch (e) {
    console.error('获取关卡失败:', e);
    return [];
  }
}

// ==================== 界面切换 ====================
function showScreen(id) {
  ['start-screen', 'auth-screen', 'lobby-screen', 'editor-screen'].forEach(sid => {
    document.getElementById(sid).style.display = sid === id ? 'flex' : 'none';
  });
}


// ==================== 界面切换函数（供 onclick 使用）====================
function showLevelSelect() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('level-select-screen').style.display = 'flex';
  resetLevelSelect();
}

function enterEditor() {
  gameState = 'editor';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('editor-screen').style.display = 'flex';
  initEditor();
}

function enterLobby() {
  if (!currentUser) { showScreen('auth-screen'); return; }
  showScreen('lobby-screen');
  refreshLobby();
}

function startGame() {
  gameState = 'playing';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('editor-screen').style.display = 'none';
  document.getElementById('lobby-screen').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('level-select-screen').style.display = 'none';
  document.getElementById('game-ui').style.display = 'block';
  document.getElementById('joystick-zone').style.display = 'block';
  document.getElementById('jump-btn').style.display = 'flex';
  document.getElementById('win-modal').style.display = 'none';
  resetPlayer();
}

function startEditorTest() {
  isEditorTest = true;
  startGame();
}

function exitGame() {
  gameState = 'start';
  document.getElementById('game-ui').style.display = 'none';
  document.getElementById('joystick-zone').style.display = 'none';
  document.getElementById('jump-btn').style.display = 'none';
  document.getElementById('win-modal').style.display = 'none';

  if (isEditorTest) {
    // 从编辑器测试返回编辑器
    isEditorTest = false;
    document.getElementById('editor-screen').style.display = 'flex';
  } else if (isFromLobby) {
    // 从大厅游玩返回大厅
    isFromLobby = false;
    showScreen('lobby-screen');
    refreshLobby();
  } else {
    // 正常游戏返回首页
    document.getElementById('start-screen').style.display = 'flex';
  }
}

// ==================== 开始界面按钮 ====================
let selectedLevelIdx = -1;

// 开始按钮 -> 显示关卡选择界面
document.getElementById('btn-start-game').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('level-select-screen').style.display = 'flex';
  resetLevelSelect();
});
document.getElementById('btn-start-game').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); document.getElementById('start-screen').style.display = 'none';
  document.getElementById('level-select-screen').style.display = 'flex';
  resetLevelSelect(); });

function resetLevelSelect() {
  selectedLevelIdx = -1;
  for (let i = 0; i < 3; i++) {
    let card = document.getElementById('lvl-' + i);
    if (card) card.className = 'lvl-card';
  }
  document.getElementById('btn-level-start').style.opacity = '0.3';
  document.getElementById('btn-level-start').style.pointerEvents = 'none';
}

// 绑定卡片点击事件
for (let i = 0; i < 3; i++) {
  let card = document.getElementById('lvl-' + i);
  if (!card) continue;
  card.addEventListener('click', function() {
    if (selectedLevelIdx === i) {
      resetLevelSelect();
      return;
    }
    selectedLevelIdx = i;
    for (let j = 0; j < 3; j++) {
      let c = document.getElementById('lvl-' + j);
      if (j === i) c.className = 'lvl-card on';
      else c.className = 'lvl-card off';
    }
    document.getElementById('btn-level-start').style.opacity = '1';
    document.getElementById('btn-level-start').style.pointerEvents = 'auto';
  });
}

// 关卡选择界面的开始游戏按钮
document.getElementById('btn-level-start').addEventListener('click', () => {
  if (selectedLevelIdx < 0) return;
  document.getElementById('level-select-screen').style.display = 'none';
  isEditorTest = false;
  loadLevel(selectedLevelIdx);
  startGame();
});
document.getElementById('btn-level-start').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); if (selectedLevelIdx < 0) return;
  document.getElementById('level-select-screen').style.display = 'none';
  loadLevel(selectedLevelIdx);
  startGame(); });

// 关卡选择界面的返回按钮
document.getElementById('btn-level-back').addEventListener('click', () => {
  document.getElementById('level-select-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
});
document.getElementById('btn-level-back').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); document.getElementById('level-select-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex'; });

document.getElementById('btn-editor').addEventListener('click', () => {
  gameState = 'editor';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('editor-screen').style.display = 'flex';
  initEditor();
});
document.getElementById('btn-editor').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); gameState = 'editor';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('editor-screen').style.display = 'flex';
  initEditor(); });

document.getElementById('btn-lobby').addEventListener('click', () => {
  if (!currentUser) { showScreen('auth-screen'); return; }
  showScreen('lobby-screen');
  refreshLobby();
});
document.getElementById('btn-lobby').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); if (!currentUser) { showScreen('auth-screen'); return; }
  showScreen('lobby-screen');
  refreshLobby(); });

// ==================== 游戏内按钮 ====================
document.getElementById('btn-restart').addEventListener('click', () => { resetPlayer(); });
document.getElementById('btn-exit').addEventListener('click', () => { exitGame(); });
document.getElementById('btn-exit').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); exitGame(); });

document.getElementById('btn-next-level').addEventListener('click', () => {
  document.getElementById('win-modal').style.display = 'none';
  if (isEditorTest) {
    // 编辑器测试时，"下一关" = 重新测试
    isEditorTest = true;
    resetPlayer();
  } else if (isFromLobby) {
    // 大厅关卡，再玩一次
    resetPlayer();
  } else if (!isCustomLevel && currentLevelIdx < BUILTIN_LEVELS.length - 1) {
    loadLevel(currentLevelIdx + 1); resetPlayer();
  } else { exitGame(); }
});
document.getElementById('btn-next-level').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); document.getElementById('win-modal').style.display = 'none'; if (isEditorTest) { isEditorTest = true; resetPlayer(); } else if (!isCustomLevel && currentLevelIdx < BUILTIN_LEVELS.length - 1) { loadLevel(currentLevelIdx + 1); resetPlayer(); } else { exitGame(); } });

document.getElementById('btn-back-menu').addEventListener('click', () => {
  document.getElementById('win-modal').style.display = 'none';
  exitGame();
});
document.getElementById('btn-back-menu').addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); document.getElementById('win-modal').style.display = 'none'; exitGame(); });

// ==================== 认证界面 ====================
let authMode = 'login';
document.getElementById('auth-switch').addEventListener('click', () => {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('auth-title').textContent = authMode === 'login' ? '登录' : '注册';
  document.getElementById('btn-auth-submit').textContent = authMode === 'login' ? '登录' : '注册';
  document.getElementById('auth-switch').textContent = authMode === 'login' ? '没有账号？点击注册' : '已有账号？点击登录';
  document.getElementById('auth-msg').textContent = '';
});

document.getElementById('btn-auth-submit').addEventListener('click', () => {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!username || !password) { document.getElementById('auth-msg').textContent = '请填写用户名和密码'; return; }
  mockAuth(username, password, authMode === 'register').then(user => {
    currentUser = user; localStorage.setItem('bwjump_user', JSON.stringify(user));
    updateUserDisplay(); showScreen('lobby-screen'); refreshLobby();
    document.getElementById('auth-username').value = '';
    document.getElementById('auth-password').value = '';
    document.getElementById('auth-msg').textContent = '';
  }).catch(err => { document.getElementById('auth-msg').textContent = err; });
});

document.getElementById('btn-auth-back').addEventListener('click', () => { showScreen('start-screen'); });

// ==================== 大厅界面 ====================
async function refreshLobby() { await renderPublicLevels(); renderMyLevels(); }

async function renderPublicLevels() {
  const container = document.getElementById('public-levels-list');
  const levels = await getSharedLevels();
  if (levels.length === 0) {
    container.innerHTML = '<p style="color:#666;text-align:center;padding:40px;">暂无分享关卡，快去编辑器创建并分享吧！</p>';
    return;
  }
  container.innerHTML = levels.map(l => `
    <div class="level-card">
      <div class="level-info"><h4>${l.name}</h4><p>作者: ${l.author} | ${l.date}</p></div>
      <div class="level-actions">
        <button class="btn" onclick="playLobbyLevel('${l.code.replace(/'/g, "\'")}')">游玩</button>
        <button class="btn" onclick="copyLevelCode('${l.code.replace(/'/g, "\'")}')">复制编码</button>
      </div>
    </div>
  `).join('');
}

function renderMyLevels() {
  const container = document.getElementById('my-levels-list');
  if (localLevels.length === 0) {
    container.innerHTML = '<p style="color:#666;text-align:center;padding:40px;">你还没有保存任何关卡</p>';
    return;
  }
  container.innerHTML = localLevels.map((l, i) => `
    <div class="level-card">
      <div class="level-info"><h4>${l.name}</h4><p>${l.date}</p></div>
      <div class="level-actions">
        <button class="btn" onclick="playLobbyLevel('${l.code.replace(/'/g, "\'")}')">游玩</button>
        <button class="btn" onclick="copyLevelCode('${l.code.replace(/'/g, "\'")}')">复制编码</button>
        <button class="btn" onclick="deleteMyLevel(${i})" style="border-color:#FFD1D4;color:#FFD1D4;">删除</button>
      </div>
    </div>
  `).join('');
}

window.playLobbyLevel = function(code) {
  isEditorTest = false;
  isFromLobby = true;
  const level = decodeLevel(code);
  if (level) { loadCustomLevel(level); startGame(); }
  else { alert('关卡编码无效'); }
};

window.copyLevelCode = async function(code) {
  const ok = await copyToClipboard(code);
  alert(ok ? '编码已复制到剪贴板' : '复制失败，请手动复制');
};

window.deleteMyLevel = function(idx) {
  if (confirm('确定删除这个关卡吗？')) {
    localLevels.splice(idx, 1); saveLocalLevels();
    renderMyLevels();
  }
};

document.querySelectorAll('.lobby-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.lobby-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    document.getElementById('lobby-public').classList.toggle('hidden', target !== 'public');
    document.getElementById('lobby-my').classList.toggle('hidden', target !== 'my');
    document.getElementById('lobby-upload').classList.toggle('hidden', target !== 'upload');
  });
});

document.getElementById('btn-upload-play').addEventListener('click', () => {
  const code = document.getElementById('upload-code-input').value.trim();
  if (!code) { alert('请输入关卡编码'); return; }
  const level = decodeLevel(code);
  if (level) { loadCustomLevel(level); startGame(); document.getElementById('upload-code-input').value = ''; }
  else { alert('关卡编码无效，请检查输入'); }
});

document.getElementById('btn-lobby-back').addEventListener('click', () => { showScreen('start-screen'); });
document.getElementById('btn-lobby-logout').addEventListener('click', () => {
  currentUser = null; localStorage.removeItem('bwjump_user');
  updateUserDisplay(); showScreen('start-screen');
});

// ==================== 编辑器按钮（底部） ====================
document.getElementById('btn-share-level').addEventListener('click', async () => {
  const code = document.getElementById('level-code-output').value;
  if (!code) { alert('请先生成关卡编码'); return; }
  const levelData = buildLevelFromEditor();
  try {
    await shareLevelToLobby(levelData, code);
    alert('关卡已分享到大厅！');
    localLevels.push({name: levelData.name, code, date: new Date().toLocaleString()});
    saveLocalLevels();
  } catch (e) {
    alert('分享失败: ' + (e.message || '网络错误'));
  }
});
document.getElementById('btn-share-level').addEventListener('touchend', async (e) => { e.preventDefault(); e.stopPropagation(); const code = document.getElementById('level-code-output').value; if (!code) { alert('请先生成关卡编码'); return; } const levelData = buildLevelFromEditor(); try { await shareLevelToLobby(levelData, code); alert('关卡已分享到大厅！'); localLevels.push({name: levelData.name, code, date: new Date().toLocaleString()}); saveLocalLevels(); } catch (e) { alert('分享失败: ' + (e.message || '网络错误')); } });

// ==================== 分享弹窗按钮 ====================
document.getElementById('btn-share-copy').addEventListener('click', async () => {
  const code = document.getElementById('share-code-display').value;
  if (code) {
    const ok = await copyToClipboard(code);
    alert(ok ? '编码已复制到剪贴板' : '复制失败，请手动复制');
  }
});

document.getElementById('btn-share-close').addEventListener('click', () => {
  document.getElementById('share-modal').style.display = 'none';
});
