    lastCamSafeZ=player.z+backZ*cosP;
    createEndWall();
    updateEnvironment();
    startBtn.style.opacity='0';
    startBtn.style.pointerEvents='none';
    const testBtnEl=document.getElementById('test-btn');
    if(testBtnEl){testBtnEl.style.opacity='0';testBtnEl.style.pointerEvents='none';}
    document.getElementById('start-title').style.opacity='0';
    document.getElementById('start-subtitle').style.opacity='0';
    document.getElementById('start-hint').style.opacity='0';
    isZooming=true;
    startZoomProgress=0;
    // 重置弹药（修复开局弹药未重置问题）
    ammo=2;maxAmmo=2;nextBarrel=0;
    barrel1HasShell=true;barrel2HasShell=true;
    barrel1Spent=false;barrel2Spent=false;
    isReloading=false;reloadProgress=0;
    if(reloadTimer){clearInterval(reloadTimer);reloadTimer=null;}
    barrelGroup.rotation.x=0;
    if(reloadShellMesh){gunGroup.remove(reloadShellMesh);reloadShellMesh=null;}
    updateAmmoDisplay();
}

function startTestMode(){
    isTestMode=true;
    gameTime=12*60;
    player.z=-150-Math.random()*100;
    player.x=(Math.random()-0.5)*6;
    player.y=0;
    player.isCrouching=false;
    player.isSprinting=false;
    input.crouch=false;
    targetH=normalH;
    currentH=normalH;
    crouchBtn.classList.remove('crouching');
    aimYaw=Math.PI+(Math.random()-0.5)*0.5;
    playerGroup.position.set(player.x,player.y,player.z);
    playerGroup.rotation.y=aimYaw;
    const cosP=Math.cos(aimPitch),sinP=Math.sin(aimPitch);
    const backX=Math.sin(aimYaw)*camCfg.distance;
    const backZ=Math.cos(aimYaw)*camCfg.distance;
    lastCamSafeX=player.x+backX*cosP;
    lastCamSafeY=player.y+camCfg.height+sinP*camCfg.distance*0.5;
    lastCamSafeZ=player.z+backZ*cosP;
    createEndWall();
    updateEnvironment();
    startBtn.style.opacity='0';
    startBtn.style.pointerEvents='none';
    document.getElementById('test-btn').style.opacity='0';
    document.getElementById('test-btn').style.pointerEvents='none';
    document.getElementById('start-title').style.opacity='0';
    document.getElementById('start-subtitle').style.opacity='0';
    document.getElementById('start-hint').style.opacity='0';
    isZooming=true;
    startZoomProgress=0;
    ammo=2;maxAmmo=2;nextBarrel=0;
    barrel1HasShell=true;barrel2HasShell=true;
    barrel1Spent=false;barrel2Spent=false;
    isReloading=false;reloadProgress=0;
    if(reloadTimer){clearInterval(reloadTimer);reloadTimer=null;}
    barrelGroup.rotation.x=0;
    if(reloadShellMesh){gunGroup.remove(reloadShellMesh);reloadShellMesh=null;}
    updateAmmoDisplay();
    if(timeSlider)timeSlider.value=720;
    updateTimeSlider();
}

function createEndWall(){
    const oldWall=scene.getObjectByName('endWall');
    const oldBarrier=scene.getObjectByName('endBarrier');
    if(oldWall)scene.remove(oldWall);
    if(oldBarrier)scene.remove(oldBarrier);
    const wallWidth=roadWidth+sidewalkWidth*2+20;
    const wallHeight=25;
    const wallGeo=new THREE.BoxGeometry(wallWidth,wallHeight,2);
    const wallMat=new THREE.MeshStandardMaterial({color:0x2a2520,roughness:0.9});
    const wall=new THREE.Mesh(wallGeo,wallMat);
    wall.position.set(0,wallHeight/2,buildingStartZ-5);
    wall.name='endWall';
    wall.castShadow=true;wall.receiveShadow=true;
    scene.add(wall);
    const barrierGeo=new THREE.BoxGeometry(wallWidth+4,1.5,3);
    const barrierMat=new THREE.MeshStandardMaterial({color:0x555544,roughness:0.7,metalness:0.3});
    const barrier=new THREE.Mesh(barrierGeo,barrierMat);
    barrier.position.set(0,0.75,buildingStartZ-2);
    barrier.name='endBarrier';
    scene.add(barrier);
}

let startBtnPressed=false;
startBtn.addEventListener('click',()=>{
    if(startBtnPressed)return;
    startBtnPressed=true;
    startBtn.style.pointerEvents='none';
    startBtn.style.opacity='0.5';
    startGame();
});
startBtn.addEventListener('touchstart',(e)=>{
    if(startBtnPressed)return;
    startBtnPressed=true;
    startBtn.style.pointerEvents='none';
    startBtn.style.opacity='0.5';
    e.preventDefault();
    startGame();
});

let testBtnPressed=false;
const testBtn=document.getElementById('test-btn');
testBtn.addEventListener('click',()=>{
    if(testBtnPressed||perfDetecting)return;
    testBtnPressed=true;
    testBtn.style.pointerEvents='none';
    testBtn.style.opacity='0.5';
    startTestMode();
});
testBtn.addEventListener('touchstart',(e)=>{
    if(testBtnPressed||perfDetecting)return;
    testBtnPressed=true;
    testBtn.style.pointerEvents='none';
    testBtn.style.opacity='0.5';
    e.preventDefault();
    startTestMode();
});

let gameOver=false;
let gameoverScreen=null;
let gameoverRestartBtn=null;

function checkGameOver(){
    if(!gameOver&&player.z<buildingStartZ+10)triggerGameOver();
}

function triggerGameOver(){
    gameOver=true;
    input.joystick.active=false;
    input.joystick.x=0;input.joystick.y=0;
    input.jump=false;input.crouch=false;input.sprint=false;input.fire=false;input.reload=false;
    if(isReloading)interruptReload();
    if(!gameoverScreen){
        gameoverScreen=document.getElementById('gameover-screen');
        gameoverRestartBtn=document.getElementById('gameover-restart');
        gameoverRestartBtn.addEventListener('click',restartGame);
        gameoverRestartBtn.addEventListener('touchstart',(e)=>{e.preventDefault();restartGame();});
    }
    gameoverScreen.classList.add('active');
}

// ========== FIX: 修复蹲下键bug ==========
// 1. 重置时清除蹲下按钮的active状态
// 2. 重置所有输入状态
// 3. 确保crouchBtn不会"消失"（game-ui active被错误移除）
function restartGame(){
    gameOver=false;
    gameoverScreen.classList.remove('active');

    // 重置玩家状态
    player.hp=player.maxHp;
    player.x=0;player.y=0;player.z=0;
    player.vx=0;player.vy=0;player.vz=0;
    player.isGrounded=true;
    player.isCrouching=false;
    player.isSprinting=false;
    aimYaw=0;aimPitch=0.08;
    currentH=normalH;targetH=normalH;

    // 重置输入状态
    input.joystick.x=0;input.joystick.y=0;input.joystick.active=false;
    input.jump=false;input.crouch=false;input.sprint=false;input.fire=false;input.reload=false;
    input.look.active=false;
    keys={};
    joyTouchId=null;lookTouchId=null;jumpTouchId=null;
    joystickKnob.style.transform='translate(-50%,-50%)';
    sprintIcon.classList.remove('active');

    // FIX: 强制清除蹲下按钮的active状态
    crouchBtn.classList.remove('crouching');

    // 重置弹药
    ammo=2;maxAmmo=2;nextBarrel=0;
    isReloading=false;reloadProgress=0;reloadType='';
    ammoToEject=0;
    barrel1HasShell=true;barrel2HasShell=true;
    barrel1Spent=false;barrel2Spent=false;
    if(reloadShellMesh){gunGroup.remove(reloadShellMesh);reloadShellMesh=null;}
    reloadShellTargetBarrel=0;
    barrelGroup.rotation.x=0;
    if(reloadTimer){clearInterval(reloadTimer);reloadTimer=null;}
    updateAmmoDisplay();

    // 重置相机
    playerGroup.position.set(0,0,0);
    playerGroup.rotation.y=0;

    // 清理枪口特效
    if(muzzleFlash){muzzleFlash.visible=false;muzzleFlashLight.intensity=0;}
    muzzleSmoke.forEach(s=>scene.remove(s.mesh));
    muzzleSmoke.length=0;
    // 清理伤害特效
    damageFlashTimer=0;damageVignetteTimer=0;damageBloodTimer=0;
    damageFlash.classList.remove('active');
    damageVignette.classList.remove('active');
    damageBlood.classList.remove('active');
    damageVignette.style.opacity='';
    damageBlood.style.opacity='';
    // 重置后坐力
    recoilPitch=0;recoilKick=0;screenShake=0;

    // 隐藏游戏UI
    document.querySelectorAll('.game-ui').forEach(el=>el.classList.remove('active'));
    watchPressed=false;

    // 显示开始画面
    startScreen.classList.remove('hidden');

    // 重置测试模式状态
    isTestMode=false;
    isFrozen=false;
    if(testPanel){testPanel.style.opacity='0';testPanel.style.pointerEvents='none';}
    if(freezeBtn){
        freezeBtn.textContent='冻结画面';
        freezeBtn.style.background='rgba(100,200,255,0.12)';
        freezeBtn.style.borderColor='rgba(100,200,255,0.25)';
        freezeBtn.style.color='#93c5fd';
    }
    testBtnPressed=false;
    if(testBtn){testBtn.style.pointerEvents='';testBtn.style.opacity='';}

    // 重置开始画面状态
    gameStarted=false;
    isZooming=false;
    startZoomProgress=0;
    startCamAngle=0;

    // 重置开始按钮状态
    startBtnPressed=false;
    startBtn.style.pointerEvents='';
    startBtn.style.opacity='';
    document.getElementById('start-title').style.opacity='';
    document.getElementById('start-subtitle').style.opacity='';
    document.getElementById('start-hint').style.opacity='';

    // 重置性能检测
    perfDetecting = false;
    perfSamples = [];
    perfDeltas = [];
    /* CSS 动画自动停止，无需清理 */
    // 移除旧遮罩
    const oldOverlay = document.getElementById('perf-overlay');
    if(oldOverlay && oldOverlay.parentNode) oldOverlay.parentNode.removeChild(oldOverlay);
    // 重新创建遮罩
    const newOverlay = document.createElement('div');
    newOverlay.id = 'perf-overlay';
    newOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:300;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s';
    newOverlay.innerHTML = '<div style="color:#fff;font-size:32px;font-weight:700;letter-spacing:8px;margin-bottom:20px">性能检测</div><div style="color:rgba(255,255,255,0.4);font-size:14px;letter-spacing:2px">正在评估设备性能...</div><div id="perf-dots" style="color:rgba(255,255,255,0.6);font-size:24px;margin-top:16px;letter-spacing:4px"><span>.</span><span>.</span><span>.</span></div>';
    document.body.appendChild(newOverlay);
    startBtn.style.pointerEvents = 'none';
    startBtn.style.opacity = '0.3';
    // 取消旧的动画循环，防止并行运行
    if(startScreenAnimId){
        cancelAnimationFrame(startScreenAnimId);
        startScreenAnimId = null;
    }
    // 重新开始画面循环
    startPerfDetect();
    animateStartScreen();
}

function animate(){
    if(gameOver){renderer.render(scene,camera);return;}
    requestAnimationFrame(animate);
    const now=performance.now();
    const dt=now-lastFrameTime;
    lastFrameTime=now;
    update(dt);
    checkGameOver();
    renderer.render(scene,camera);
}

// 手表长按事件
watchBtn.addEventListener('mousedown',()=>{if(gameOver)return;watchPressed=true;timeDisplay.classList.add('active');});
watchBtn.addEventListener('mouseup',()=>{if(gameOver)return;watchPressed=false;timeDisplay.classList.remove('active');});
watchBtn.addEventListener('mouseleave',()=>{if(gameOver)return;watchPressed=false;timeDisplay.classList.remove('active');});
watchBtn.addEventListener('touchstart',(e)=>{if(gameOver)return;e.preventDefault();watchPressed=true;timeDisplay.classList.add('active');});
watchBtn.addEventListener('touchend',(e)=>{if(gameOver)return;e.preventDefault();watchPressed=false;timeDisplay.classList.remove('active');});

window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
    refreshRects();
});
// 初始化时缓存一次
refreshRects();

// 启动开始画面 + 性能检测
startPerfDetect();
animateStartScreen();
</script>

<div id="gameover-screen">
    <div id="gameover-title">突围成功</div>
    <div id="gameover-subtitle">MISSION ACCOMPLISHED</div>
    <div id="gameover-line"></div>
    <div id="gameover-thanks">感谢你对本次的游玩</div>
    <div id="gameover-feedback">有建议，请提出来</div>
    <button id="gameover-restart">再来一次</button>
</div>
</body>
