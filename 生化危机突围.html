<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>3D 阴暗街道</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#gameCanvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0;z-index:1}
.glass{background:rgba(255,255,255,0.15);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.25);box-shadow:0 4px 16px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.2);border-radius:50%;position:absolute;transition:transform 0.1s,background 0.2s;z-index:10;display:flex;align-items:center;justify-content:center}
.glass:active{background:rgba(255,255,255,0.25);transform:scale(0.95)}
.glass svg{fill:rgba(255,255,255,0.9);filter:drop-shadow(0 1px 2px rgba(0,0,0,0.3))}
#joystick-zone{position:absolute;bottom:40px;left:40px;width:160px;height:160px;z-index:10}
#joystick-base{width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.08);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);position:absolute;top:0;left:0}
#joystick-knob{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.4);box-shadow:0 2px 12px rgba(0,0,0,0.3);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
#joystick-sprint-icon{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:36px;height:36px;opacity:0;transition:opacity 0.2s;pointer-events:none}
#joystick-sprint-icon.active{opacity:1}
#sprint-zone{position:absolute;bottom:200px;left:0;width:55vw;height:45vh;z-index:9;pointer-events:none}
#sprint-zone-indicator{position:absolute;bottom:0;left:0;width:100%;height:100%;background:linear-gradient(to top,rgba(255,200,50,0.0),rgba(255,200,50,0.0));border-radius:0;opacity:0;transition:opacity 0.2s}
#sprint-zone-indicator.active{opacity:0}
#fire-btn{width:160px;height:160px;bottom:40px;right:40px}
#fire-btn svg{width:60px;height:60px}
#jump-btn{width:120px;height:120px;bottom:60px;right:220px}
#jump-btn svg{width:48px;height:48px}
#reload-btn{width:80px;height:80px;bottom:80px;right:360px}
#reload-btn svg{width:36px;height:36px}
#crouch-btn{width:70px;height:70px;bottom:215px;right:85px;border-radius:16px}
#crouch-btn.crouching{background:rgba(100,200,255,0.3);border-color:rgba(100,200,255,0.5)}
#crouch-btn svg{width:32px;height:32px}
#ammo-display{position:absolute;bottom:215px;right:170px;color:rgba(255,255,255,0.9);font-size:24px;font-weight:bold;font-family:monospace;z-index:10;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,0.5)}
#reload-bar-container{position:absolute;bottom:40px;right:360px;width:80px;height:6px;background:rgba(0,0,0,0.5);border-radius:3px;z-index:10;overflow:hidden;opacity:0;transition:opacity 0.2s;pointer-events:none}
#reload-bar-container.active{opacity:1}
#reload-bar-fill{width:0%;height:100%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:3px;}
#load-bar-container{position:absolute;bottom:50px;right:360px;width:80px;height:4px;background:rgba(0,0,0,0.4);border-radius:2px;z-index:10;overflow:hidden;opacity:0;transition:opacity 0.2s;pointer-events:none}
#load-bar-container.active{opacity:1}
#load-bar-fill{width:0%;height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:2px;}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none}
#crosshair-dot{width:6px;height:6px;background:rgba(255,255,255,0.95);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(0,0,0,0.6),0 0 12px rgba(255,255,255,0.3)}
.sprint-svg{fill:rgba(255,200,50,0.95);filter:drop-shadow(0 0 6px rgba(255,200,50,0.6))}
#hint{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:12px;z-index:10;pointer-events:none;text-align:center;line-height:1.6}
#fps-counter{position:absolute;top:10px;left:10px;color:#00ff88;font-family:monospace;font-size:14px;z-index:100;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,1)}
#watch-btn{position:absolute;top:20px;right:20px;width:56px;height:56px;z-index:10;background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform 0.1s,background 0.2s}
#watch-btn:active{background:rgba(255,255,255,0.25);transform:scale(0.92)}
#watch-btn svg{width:28px;height:28px;fill:rgba(255,255,255,0.85);filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4))}
#time-display{position:absolute;top:20px;right:90px;color:rgba(255,255,255,0.9);font-family:monospace;font-size:28px;font-weight:bold;z-index:10;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,0.8);opacity:0;transition:opacity 0.3s;letter-spacing:2px}
#time-display.active{opacity:1}
#compass{position:absolute;top:20px;left:50%;width:70px;height:70px;z-index:10;pointer-events:none;transform:translateX(-50%)}
#compass-ring{width:70px;height:70px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.15);position:absolute;top:0;left:0;background:rgba(0,0,0,0.15);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#compass-n{position:absolute;top:4px;left:50%;transform:translateX(-50%);color:#ff5555;font-size:10px;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
#compass-s{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:10px;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
#compass-e{position:absolute;top:50%;right:4px;transform:translateY(-50%);color:rgba(255,255,255,0.4);font-size:10px;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
#compass-w{position:absolute;top:50%;left:4px;transform:translateY(-50%);color:rgba(255,255,255,0.4);font-size:10px;text-shadow:0 1px 3px rgba(0,0,0,0.8)}
#start-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:200;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s}
#start-screen.hidden{opacity:0;pointer-events:none}
#start-title{color:#fff;font-size:72px;font-weight:900;letter-spacing:24px;text-shadow:0 0 40px rgba(255,100,50,0.4),0 4px 20px rgba(0,0,0,0.8);margin-bottom:60px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:opacity 0.4s ease}
#start-subtitle{color:rgba(255,255,255,0.4);font-size:14px;letter-spacing:8px;margin-bottom:80px;transition:opacity 0.4s ease}
#start-btn{padding:18px 64px;background:linear-gradient(135deg,rgba(255,100,50,0.85),rgba(200,50,30,0.85));border:1px solid rgba(255,180,120,0.6);border-radius:8px;color:#fff;font-size:20px;font-weight:600;letter-spacing:4px;cursor:pointer;backdrop-filter:blur(12px) saturate(1.1);-webkit-backdrop-filter:blur(12px) saturate(1.1);transition:all 0.15s cubic-bezier(0.4,0,0.2,1);box-shadow:0 4px 24px rgba(255,80,30,0.3),inset 0 1px 0 rgba(255,255,255,0.15)}
#start-btn:hover{transform:scale(1.06);box-shadow:0 8px 36px rgba(255,100,40,0.5),inset 0 1px 0 rgba(255,255,255,0.2)}
#start-btn:active{transform:scale(0.88);background:linear-gradient(135deg,rgba(255,140,80,0.95),rgba(230,80,50,0.95));box-shadow:0 2px 12px rgba(255,100,40,0.6),inset 0 2px 8px rgba(255,200,150,0.3);border-color:rgba(255,220,180,0.8)}
#test-btn{padding:12px 48px;background:linear-gradient(135deg,rgba(100,150,255,0.6),rgba(60,100,200,0.6));border:1px solid rgba(150,180,255,0.4);border-radius:8px;color:#fff;font-size:16px;font-weight:600;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(12px) saturate(1.1);-webkit-backdrop-filter:blur(12px) saturate(1.1);transition:all 0.15s cubic-bezier(0.4,0,0.2,1);box-shadow:0 4px 24px rgba(80,120,255,0.2),inset 0 1px 0 rgba(255,255,255,0.15);margin-top:16px}
#test-btn:hover{transform:scale(1.06);box-shadow:0 8px 36px rgba(100,150,255,0.4),inset 0 1px 0 rgba(255,255,255,0.2)}
#test-btn:active{transform:scale(0.88);background:linear-gradient(135deg,rgba(120,170,255,0.8),rgba(80,120,220,0.8));box-shadow:0 2px 12px rgba(100,150,255,0.5),inset 0 2px 8px rgba(200,220,255,0.3);border-color:rgba(180,200,255,0.7)}
#start-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0.25;pointer-events:none}
#start-hint{color:rgba(255,200,150,0.6);font-size:13px;letter-spacing:2px;margin-bottom:40px;text-shadow:0 1px 4px rgba(0,0,0,0.5);transition:opacity 0.4s ease}
.game-ui{opacity:0;pointer-events:none;transition:opacity 0.5s}
.game-ui.active{opacity:1;pointer-events:auto}
#crosshair.game-ui{transition:opacity 0.3s}
#hp-container{position:absolute;top:20px;left:20px;width:200px;height:28px;z-index:10;pointer-events:none;display:flex;align-items:center;gap:8px}
#hp-label{color:rgba(255,255,255,0.9);font-size:13px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-shadow:0 1px 4px rgba(0,0,0,0.8);letter-spacing:2px;white-space:nowrap}
#hp-bg{flex:1;height:18px;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);border-radius:9px;overflow:hidden;position:relative}
#hp-fill{width:100%;height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);border-radius:9px;transition:width 0.3s cubic-bezier(0.4,0,0.2,1),background 0.3s}
#hp-fill.low{background:linear-gradient(90deg,#ef4444,#f87171)}
#hp-fill.critical{background:linear-gradient(90deg,#dc2626,#ef4444);animation:hpPulse 0.6s ease-in-out infinite}
@keyframes hpPulse{0%,100%{opacity:1}50%{opacity:0.6}}
#hp-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:10px;font-weight:700;font-family:monospace;text-shadow:0 1px 3px rgba(0,0,0,0.8);letter-spacing:1px;pointer-events:none}
#damage-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:150;opacity:0;transition:opacity 0.15s}
#damage-overlay.active{opacity:1}
#damage-vignette{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at center,transparent 50%,rgba(180,20,20,0.0) 60%,rgba(220,30,30,0.35) 100%);opacity:0;transition:opacity 0.3s}
#damage-vignette.active{opacity:1}
#damage-blood{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity 0.4s}
#damage-blood.active{opacity:0.6}
#damage-blood svg{width:100%;height:100%}
#damage-flash{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,0,0,0.0);transition:background 0.1s}
#damage-flash.active{background:rgba(255,0,0,0.25);transition:background 0.05s}
#gameover-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:300;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s ease-in}
#gameover-screen.active{opacity:1;pointer-events:auto}
#gameover-title{color:#fff;font-size:56px;font-weight:900;letter-spacing:16px;text-shadow:0 0 60px rgba(255,100,50,0.5),0 4px 20px rgba(0,0,0,0.8);margin-bottom:40px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;animation:fadeInUp 0.8s ease-out}
#gameover-subtitle{color:rgba(255,255,255,0.6);font-size:16px;letter-spacing:6px;margin-bottom:60px;animation:fadeInUp 0.8s ease-out 0.3s both}
#gameover-line{width:120px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,150,100,0.6),transparent);margin-bottom:60px;animation:fadeInUp 0.8s ease-out 0.5s both}
#gameover-thanks{color:rgba(255,255,255,0.9);font-size:22px;font-weight:500;letter-spacing:4px;margin-bottom:20px;text-align:center;line-height:1.8;animation:fadeInUp 0.8s ease-out 0.7s both}
#gameover-feedback{color:rgba(255,200,150,0.7);font-size:14px;letter-spacing:2px;text-align:center;line-height:1.6;animation:fadeInUp 0.8s ease-out 0.9s both}
#gameover-restart{padding:14px 48px;margin-top:50px;background:linear-gradient(135deg,rgba(255,100,50,0.8),rgba(200,50,30,0.8));border:1px solid rgba(255,150,100,0.5);border-radius:8px;color:#fff;font-size:16px;font-weight:600;letter-spacing:3px;cursor:pointer;backdrop-filter:blur(8px);transition:all 0.2s;box-shadow:0 4px 24px rgba(255,80,30,0.3);animation:fadeInUp 0.8s ease-out 1.1s both}
#gameover-restart:hover{transform:scale(1.05);box-shadow:0 6px 32px rgba(255,80,30,0.5)}
#gameover-restart:active{transform:scale(0.95)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

/* 性能检测省略号动画 */
@keyframes perfDots{0%,100%{opacity:0.3}50%{opacity:1}}
#perf-dots span{display:inline-block;animation:perfDots 1s infinite}
#perf-dots span:nth-child(2){animation-delay:0.2s}
#perf-dots span:nth-child(3){animation-delay:0.4s}

/* 画质设置面板 */
#settings-btn{position:absolute;top:20px;left:20px;width:48px;height:48px;z-index:210;background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.1s,background 0.2s}
#settings-btn:active{background:rgba(255,255,255,0.25);transform:scale(0.92)}
#settings-btn svg{width:24px;height:24px;fill:rgba(255,255,255,0.85);filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4))}
#settings-panel{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:220;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s}
#settings-panel.active{opacity:1;pointer-events:auto}
#settings-box{background:rgba(20,20,25,0.95);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px 40px;width:320px;max-width:90vw}
#settings-title{color:#fff;font-size:22px;font-weight:700;letter-spacing:4px;margin-bottom:24px;text-align:center}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.settings-label{color:rgba(255,255,255,0.7);font-size:14px}
.settings-options{display:flex;gap:8px}
.quality-btn{padding:6px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:rgba(255,255,255,0.6);font-size:12px;cursor:pointer;transition:all 0.2s}
.quality-btn:hover{background:rgba(255,255,255,0.15)}
.quality-btn.active{background:rgba(100,150,255,0.25);border-color:rgba(100,150,255,0.5);color:#93c5fd}
#settings-close{width:100%;padding:10px;margin-top:16px;background:linear-gradient(135deg,rgba(255,100,50,0.6),rgba(200,50,30,0.6));border:1px solid rgba(255,150,100,0.4);border-radius:8px;color:#fff;font-size:14px;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all 0.2s}
#settings-close:hover{transform:scale(1.02)}
#settings-close:active{transform:scale(0.98)}

</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>


<!-- 设置面板 -->
<div id="settings-panel" ontouchstart="event.stopPropagation()" ontouchmove="event.stopPropagation()">
    <div id="settings-box">
        <div id="settings-title">画质设置</div>
        <div class="settings-row">
            <span class="settings-label">画质等级</span>
            <div class="settings-options">
                <button class="quality-btn" data-quality="low">低</button>
                <button class="quality-btn" data-quality="medium">中</button>
                <button class="quality-btn" data-quality="high">高</button>
                <button class="quality-btn" data-quality="ultra">极致</button>
            </div>
        </div>
        <div class="settings-row">
            <span class="settings-label">阴影</span>
            <div class="settings-options">
                <button class="quality-btn" data-shadow="off">关闭</button>
                <button class="quality-btn" data-shadow="low">低</button>
                <button class="quality-btn" data-shadow="high">高</button>
            </div>
        </div>
        <div class="settings-row">
            <span class="settings-label">反射</span>
            <div class="settings-options">
                <button class="quality-btn" data-reflect="off">关闭</button>
                <button class="quality-btn" data-reflect="on">开启</button>
            </div>
        </div>
        <button id="settings-close">关闭</button>
    </div>
</div>

<div id="start-screen">
    <div id="settings-btn">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </div>
    <div id="start-title">突围</div>
    <div id="start-subtitle">BREAKOUT</div>
    <div id="start-hint">我们的目标是到达最北边的墙</div>
    <button id="start-btn">开始游戏</button>
    <button id="test-btn">测试模式</button>
</div>

<!-- 性能检测遮罩 -->
<div id="perf-overlay" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:300;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.8s">
    <div style="color:#fff;font-size:32px;font-weight:700;letter-spacing:8px;margin-bottom:20px">性能检测</div>
    <div style="color:rgba(255,255,255,0.4);font-size:14px;letter-spacing:2px">正在评估设备性能...</div>
    <div id="perf-dots" style="color:rgba(255,255,255,0.6);font-size:24px;margin-top:16px;letter-spacing:4px"><span>.</span><span>.</span><span>.</span></div>
</div>

<div id="story-overlay" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:250;background:#000;opacity:0;pointer-events:none;transition:opacity 1.5s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center">
    <div id="story-text" style="color:rgba(255,255,255,0.9);font-size:20px;line-height:2.2;max-width:560px;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,0.9);min-height:60px"></div>
    <div id="story-skip-hint" style="color:rgba(255,255,255,0.3);font-size:12px;margin-top:40px;letter-spacing:2px;opacity:0;transition:opacity 1s ease">点击屏幕跳过</div>
</div>
<div id="fade-black" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:245;background:#000;opacity:0;pointer-events:none;transition:opacity 0.3s"></div>

<div id="hp-container" class="game-ui">
    <div id="hp-label">血量</div>
    <div id="hp-bg">
        <div id="hp-fill"></div>
        <div id="hp-text">100 / 100</div>
    </div>
</div>

<div id="infection-screen"></div>

<script>
// ==================== 常量与配置 ====================
const CHUNK_SIZE = 50;
function getChunkIndex(z){return Math.floor(z/CHUNK_SIZE);}

const canvas=document.getElementById('gameCanvas');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050510);
scene.fog=new THREE.Fog(0x050510,30,180);

const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,300);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.physicallyCorrectLights=true;

// 阴暗光照
let ambientLight=new THREE.AmbientLight(0x1a1a2e,0.15);
scene.add(ambientLight);
let dirLightRef=new THREE.DirectionalLight(0x334455,0.2);
dirLightRef.position.set(30,80,30);
dirLightRef.castShadow=true;
const d=100;
dirLightRef.shadow.mapSize.set(256,256);
dirLightRef.shadow.camera.left=-d;dirLightRef.shadow.camera.right=d;
dirLightRef.shadow.camera.top=d;dirLightRef.shadow.camera.bottom=-d;
dirLightRef.shadow.camera.near=5;dirLightRef.shadow.camera.far=300;
scene.add(dirLightRef);

// ==================== 对象池 ====================
const SHELL_POOL_SIZE=20,HOLE_POOL_SIZE=50,BULLET_POOL_SIZE=100;
const shellPool=[],activeShells=[];
const holePool=[],activeHoles=[];
const bulletPool=[],activeBullets=[];

const shellGeo=new THREE.CylinderGeometry(0.055,0.055,0.22,8);
const shellMat=new THREE.MeshStandardMaterial({color:0xffd700,roughness:0.2,metalness:0.95,emissive:0xaa6600,emissiveIntensity:0.15});
for(let i=0;i<SHELL_POOL_SIZE;i++){
    const shell=new THREE.Mesh(shellGeo,shellMat);
    shell.visible=false;scene.add(shell);
    shellPool.push({mesh:shell,active:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,rx:0,ry:0,rz:0,life:0});
}

const holeGeo=new THREE.PlaneGeometry(0.12,0.12);
const holeMatGround=new THREE.MeshBasicMaterial({color:0x1a1a1a,transparent:true,opacity:0.7,side:THREE.DoubleSide});
const holeMatBox=new THREE.MeshBasicMaterial({color:0x3d2817,transparent:true,opacity:0.7,side:THREE.DoubleSide});
for(let i=0;i<HOLE_POOL_SIZE;i++){
    const hole=new THREE.Mesh(holeGeo,holeMatGround);
    hole.visible=false;scene.add(hole);
    holePool.push({mesh:hole,active:false,life:0});
}

const bulletGeo=new THREE.SphereGeometry(0.02,4,4);
const bulletMat=new THREE.MeshBasicMaterial({color:0xffd700});
for(let i=0;i<BULLET_POOL_SIZE;i++){
    const bullet=new THREE.Mesh(bulletGeo,bulletMat);
    bullet.visible=false;scene.add(bullet);
    bulletPool.push({mesh:bullet,active:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,life:0,distanceTraveled:0,effectiveRange:0,targetPoint:null});
}

const _v2Center=new THREE.Vector2(0,0);
const _v3Up=new THREE.Vector3(0,1,0);
const _v3Normal=new THREE.Vector3(0,1,0);

// ==================== Vector3 复用池 ====================
const V3_POOL_SIZE=16;
const v3Pool=[];
for(let i=0;i<V3_POOL_SIZE;i++)v3Pool.push(new THREE.Vector3());
let v3PoolIdx=0;
function getV3(){const v=v3Pool[v3PoolIdx];v3PoolIdx=(v3PoolIdx+1)%V3_POOL_SIZE;return v;}

// 全局复用 Raycaster
const sharedRaycaster=new THREE.Raycaster();


// ==================== 性能检测与自适应 ====================
let perfScore = 100;
let adaptiveQuality = 'high';
let perfSamples = [];
let perfDeltas = [];
let perfStartTime = 0;
let perfDetecting = false;
let perfTimeoutId = null;
let startScreenAnimId = null;

function startPerfDetect(){
    perfDetecting = true;
    perfSamples = [];
    perfDeltas = [];
    perfStartTime = performance.now();
    // 黑屏遮罩已显示"性能检测"，无需修改 start-hint

    // 超时 fallback：无论帧率如何，最多 3 秒后强制结束
    if(perfTimeoutId) clearTimeout(perfTimeoutId);
    perfTimeoutId = setTimeout(() => {
        if(perfDetecting){
            perfDetecting = false;
            perfScore = 60;
            adaptiveQuality = 'medium';
            applyQualitySettings();
            hidePerfOverlay();
        }
    }, 3000);
}

function hidePerfOverlay(){
    const overlay = document.getElementById('perf-overlay');
    if(overlay){
        overlay.style.opacity = '0';
        setTimeout(() => {
            if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 800);
    }
    if(startBtn && !startBtnPressed && !testBtnPressed){
        startBtn.style.pointerEvents = '';
        startBtn.style.opacity = '';
    }
    if(perfTimeoutId){
        clearTimeout(perfTimeoutId);
        perfTimeoutId = null;
    }
}

function collectPerfSample(){
    if(!perfDetecting) return;
    let now = performance.now();
    if(perfSamples.length > 0){
        let last = perfSamples[perfSamples.length-1];
        if(typeof last === 'number'){
            perfDeltas.push(now - last);
        }
    }
    perfSamples.push(now);
    if(now - perfStartTime < 2000){
        return;
    }
    // 完成检测
    perfDetecting = false;
    let deltas = perfDeltas.slice();
    if(deltas.length < 5){
        perfScore = 100; adaptiveQuality = 'ultra';
    }else{
        deltas.sort((a,b)=>a-b);
        let p95 = deltas[Math.floor(deltas.length*0.95)] || 16;
        if(p95 < 16){ perfScore = 100; adaptiveQuality = 'ultra'; }
        else if(p95 < 22){ perfScore = 85; adaptiveQuality = 'high'; }
        else if(p95 < 30){ perfScore = 60; adaptiveQuality = 'medium'; }
        else{ perfScore = 35; adaptiveQuality = 'low'; }
    }
    applyQualitySettings();
    hidePerfOverlay();
    console.log('Perf:', adaptiveQuality, 'p95:', (deltas[Math.floor(deltas.length*0.95)]||16).toFixed(1)+'ms');
}

function applyQualitySettings(){
    if(adaptiveQuality === 'low'){
        renderer.shadowMap.enabled = false;
        dirLightRef.castShadow = false;
        scene.fog.far = 120;
        renderer.setPixelRatio(1);
    }else if(adaptiveQuality === 'medium'){
        renderer.shadowMap.enabled = true;
        dirLightRef.castShadow = true;
        dirLightRef.shadow.mapSize.set(256,256);
        scene.fog.far = 200;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
    }else if(adaptiveQuality === 'high'){
        renderer.shadowMap.enabled = true;
        dirLightRef.castShadow = true;
        dirLightRef.shadow.mapSize.set(512,512);
        scene.fog.far = 300;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    }else if(adaptiveQuality === 'ultra'){
        renderer.shadowMap.enabled = true;
        dirLightRef.castShadow = true;
        dirLightRef.shadow.mapSize.set(1024,1024);
        scene.fog.far = 400;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    }
    updateDetailLevel();
}

// ==================== 动态细节级别 ====================
let detailObjects=[];

function createSignTexture(text,bgColor,textColor){
    const c=document.createElement('canvas');
    c.width=256;c.height=64;
    const ctx=c.getContext('2d');
    ctx.fillStyle=bgColor;
    ctx.fillRect(0,0,256,64);
    // 边框
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    ctx.lineWidth=2;
    ctx.strokeRect(2,2,252,60);
    // 文字
    ctx.fillStyle=textColor;
    ctx.font='bold 28px sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(text,128,32);
    // 噪点
    for(let i=0;i<50;i++){
        ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.15})`;
        ctx.fillRect(Math.random()*256,Math.random()*64,1,1);
    }
    return new THREE.CanvasTexture(c);
}

function updateDetailLevel(){
    detailObjects.forEach(o=>{if(o.parent)o.parent.remove(o);});
    detailObjects=[];
    if(adaptiveQuality==='high'||adaptiveQuality==='ultra'){
        addHighDetailDecorations();
    }
    if(adaptiveQuality==='ultra'){
        addUltraDetailDecorations();
    }
}

function addHighDetailDecorations(){
    const signTexts=['商店','餐厅','旅馆','酒吧','咖啡','书店','药店','超市'];
    let signIdx=0;
    boxes.forEach(b=>{
        if(!b.userData.isBox)return;
        const min=b.userData.min,max=b.userData.max;
        const h=max.y-min.y;
        const side=min.x<-5?'left':'right';

        // 带文字的发光招牌
        if(h>18&&Math.random()>0.55){
            const signW=4.5,signH=1.1;
            const signGeo=new THREE.BoxGeometry(0.08,signH,signW);
            const text=signTexts[signIdx%signTexts.length];
            signIdx++;
            const colors=[['#8b0000','#ff6666'],['#004400','#66ff66'],['#000066','#6666ff'],['#664400','#ffcc66']];
            const ci=Math.floor(Math.random()*colors.length);
            const signTex=createSignTexture(text,colors[ci][0],colors[ci][1]);
            const signMat=new THREE.MeshStandardMaterial({
                map:signTex,
                roughness:0.3,
                metalness:0.2,
                emissive:new THREE.Color(colors[ci][0]),
                emissiveIntensity:0.4,
                emissiveMap:signTex
            });
            const sign=new THREE.Mesh(signGeo,signMat);
            const signX=side==='left'?max.x+0.05:min.x-0.05;
            sign.position.set(signX,min.y+h*0.72,min.z+(max.z-min.z)*(0.15+Math.random()*0.25));
            // 招牌支架
            const bracketGeo=new THREE.CylinderGeometry(0.02,0.02,0.25,6);
            const bracketMat=new THREE.MeshStandardMaterial({color:0x333333,metalness:0.8,roughness:0.3});
            const bracket=new THREE.Mesh(bracketGeo,bracketMat);
            bracket.rotation.z=Math.PI/2;
            bracket.position.set(side==='left'?-0.12:0.12,0,0);
            sign.add(bracket);
            scene.add(sign);
            detailObjects.push(sign);
        }
    });
}

function addUltraDetailDecorations(){
    boxes.forEach(b=>{
        if(!b.userData.isBox)return;
        const min=b.userData.min,max=b.userData.max;
        const h=max.y-min.y;
        const side=min.x<-5?'left':'right';
        const outX=side==='left'?max.x+0.1:min.x-0.1;

        // 空调外机（真实比例：约0.9x0.65x0.35米）
        if(h>14&&Math.random()>0.45){
            const acGroup=new THREE.Group();
            // 主机箱
            const bodyGeo=new THREE.BoxGeometry(0.9,0.65,0.35);
            const bodyMat=new THREE.MeshStandardMaterial({color:0x888888,roughness:0.4,metalness:0.7});
            const body=new THREE.Mesh(bodyGeo,bodyMat);
            acGroup.add(body);
            // 风扇格栅
            const grillGeo=new THREE.PlaneGeometry(0.6,0.5);
            const grillCanvas=document.createElement('canvas');
            grillCanvas.width=128;grillCanvas.height=128;
            const gctx=grillCanvas.getContext('2d');
            gctx.fillStyle='#777';gctx.fillRect(0,0,128,128);
            gctx.strokeStyle='#333';gctx.lineWidth=3;
            for(let i=0;i<=128;i+=16){gctx.beginPath();gctx.moveTo(i,0);gctx.lineTo(i,128);gctx.stroke();}
            for(let i=0;i<=128;i+=16){gctx.beginPath();gctx.moveTo(0,i);gctx.lineTo(128,i);gctx.stroke();}
            const grillTex=new THREE.CanvasTexture(grillCanvas);
            const grillMat=new THREE.MeshStandardMaterial({map:grillTex,roughness:0.5,metalness:0.6,transparent:true,opacity:0.95});
            const grill=new THREE.Mesh(grillGeo,grillMat);
            grill.position.set(side==='left'?0.18:-0.18,0,0);
            grill.rotation.y=side==='left'?Math.PI/2:-Math.PI/2;
            acGroup.add(grill);
            // 品牌标签
            const labelGeo=new THREE.PlaneGeometry(0.5,0.12);
            const labelCanvas=document.createElement('canvas');
            labelCanvas.width=256;labelCanvas.height=64;
            const lctx=labelCanvas.getContext('2d');
            lctx.fillStyle='#666';lctx.fillRect(0,0,256,64);
            lctx.fillStyle='#aaa';lctx.font='bold 20px sans-serif';
            lctx.textAlign='center';lctx.textBaseline='middle';
            lctx.fillText('HITACHI',128,32);
            const labelTex=new THREE.CanvasTexture(labelCanvas);
            const labelMat=new THREE.MeshStandardMaterial({map:labelTex,roughness:0.3,metalness:0.4});
            const label=new THREE.Mesh(labelGeo,labelMat);
            label.position.set(0,0.33,0);
            label.rotation.x=-Math.PI/2;
            acGroup.add(label);
            // 管道
            const pipeGeo=new THREE.CylinderGeometry(0.04,0.04,1.2,8);
            const pipeMat=new THREE.MeshStandardMaterial({color:0x555555,metalness:0.8,roughness:0.2});
            const pipe=new THREE.Mesh(pipeGeo,pipeMat);
            pipe.position.set(0.25,-0.35,0.1);
            pipe.rotation.x=Math.PI/2;
            acGroup.add(pipe);
            // 支架
            const bracketGeo=new THREE.BoxGeometry(0.25,0.06,0.35);
            const bracketMat=new THREE.MeshStandardMaterial({color:0x444444,metalness:0.7,roughness:0.4});
            const bracket=new THREE.Mesh(bracketGeo,bracketMat);
            bracket.position.set(side==='left'?0.15:-0.15,-0.36,0);
            acGroup.add(bracket);

            acGroup.position.set(outX,min.y+3+Math.random()*(h-6),min.z+2+Math.random()*(max.z-min.z-5));
            scene.add(acGroup);
            detailObjects.push(acGroup);
        }

        // 排水管
        if(h>12&&Math.random()>0.6){
            const pipeH=h*0.85;
            const pipeGeo=new THREE.CylinderGeometry(0.1,0.1,pipeH,10);
            const pipeMat=new THREE.MeshStandardMaterial({color:0x444444,metalness:0.5,roughness:0.5});
            const pipe=new THREE.Mesh(pipeGeo,pipeMat);
            const pipeX=side==='left'?max.x+0.12:min.x-0.12;
            pipe.position.set(pipeX,min.y+pipeH/2,min.z+(max.z-min.z)*(0.05+Math.random()*0.1));
            scene.add(pipe);
            detailObjects.push(pipe);
            // 排水管弯头
            const elbowGeo=new THREE.TorusGeometry(0.12,0.08,8,12,Math.PI/2);
            const elbowMat=new THREE.MeshStandardMaterial({color:0x444444,metalness:0.5,roughness:0.5});
            const elbow=new THREE.Mesh(elbowGeo,elbowMat);
            elbow.position.set(pipeX,min.y+pipeH,min.z+(max.z-min.z)*(0.05+Math.random()*0.1));
            elbow.rotation.z=side==='left'?Math.PI/2:0;
            scene.add(elbow);
            detailObjects.push(elbow);
        }

        // 竖版招牌
        if(h>10&&Math.random()>0.5){
            const vSignW=0.6,vSignH=2.2;
            const vSignGeo=new THREE.BoxGeometry(0.06,vSignH,vSignW);
            const vSignColors=[0xcc3333,0x3366cc,0x33cc66,0xcc9933];

// ==================== 程序化高精度纹理生成 ====================
function createNormalMapCanvas(width,height,intensity){
    const c=document.createElement('canvas');
    c.width=width;c.height=height;
    const ctx=c.getContext('2d');
    const imgData=ctx.createImageData(width,height);
    const d=imgData.data;
    for(let i=0;i<width*height;i++){
        const nx=(Math.random()-0.5)*intensity;
        const ny=(Math.random()-0.5)*intensity;
        d[i*4]=Math.floor((0.5+nx)*255);
        d[i*4+1]=Math.floor((0.5+ny)*255);
        d[i*4+2]=255;
        d[i*4+3]=255;
    }
    ctx.putImageData(imgData,0,0);
    return c;
}

function createNoiseCanvas(width,height,baseColor,noiseIntensity,grainSize){
    const c=document.createElement('canvas');
    c.width=width;c.height=height;
    const ctx=c.getContext('2d');
    ctx.fillStyle=baseColor;
    ctx.fillRect(0,0,width,height);
    const imgData=ctx.getImageData(0,0,width,height);
    const d=imgData.data;
    const r=parseInt(baseColor.slice(1,3),16),g=parseInt(baseColor.slice(3,5),16),b=parseInt(baseColor.slice(5,7),16);
    for(let y=0;y<height;y+=grainSize){
        for(let x=0;x<width;x+=grainSize){
            const n=(Math.random()-0.5)*noiseIntensity;
            const nr=Math.max(0,Math.min(255,r+n));
            const ng=Math.max(0,Math.min(255,g+n));
            const nb=Math.max(0,Math.min(255,b+n));
            for(let dy=0;dy<grainSize&&y+dy<height;dy++){
                for(let dx=0;dx<grainSize&&x+dx<width;dx++){
                    const idx=((y+dy)*width+(x+dx))*4;
                    d[idx]=nr;d[idx+1]=ng;d[idx+2]=nb;
                }
            }
        }
    }
    ctx.putImageData(imgData,0,0);
    return c;
}

function createBrickCanvas(width,height,brickColor,mortarColor){
    const c=document.createElement('canvas');
    c.width=width;c.height=height;
    const ctx=c.getContext('2d');
    ctx.fillStyle=mortarColor;
    ctx.fillRect(0,0,width,height);
    const bh=32,bw=64;
    for(let y=0;y<height;y+=bh){
        const offset=(Math.floor(y/bh)%2)*(bw/2);
        for(let x=-bw;x<width;x+=bw){
            const ox=x+offset;
            const shade=Math.random()*20-10;
            const r=parseInt(brickColor.slice(1,3),16)+shade;
            const g=parseInt(brickColor.slice(3,5),16)+shade;
            const b=parseInt(brickColor.slice(5,7),16)+shade;
            ctx.fillStyle=`rgb(${Math.max(0,Math.min(255,r))},${Math.max(0,Math.min(255,g))},${Math.max(0,Math.min(255,b))}`;
            ctx.fillRect(ox+2,y+2,bw-4,bh-4);
        }
    }
    return c;
}

function createAsphaltCanvas(width,height){
    const c=document.createElement('canvas');
    c.width=width;c.height=height;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#1a1a1a';
    ctx.fillRect(0,0,width,height);
    for(let i=0;i<2000;i++){
        const x=Math.random()*width,y=Math.random()*height;
        const s=Math.random()*2+0.5;
        const gray=20+Math.random()*30;
        ctx.fillStyle=`rgba(${gray},${gray},${gray},${0.3+Math.random()*0.4})`;
        ctx.fillRect(x,y,s,s);
    }
    return c;
}

                winL.position.set(doorX,winY,z-doorHalfW-sideWindowW/2);

                win.position.set(doorX,winY,winZ);
                win.rotation.y=side==='left'?Math.PI/2:-Math.PI/2;

            }
        }
    }
}

function createEjectedShell(x,y,z,dirRight,dirUp){
    let shell=null;
    for(let i=0;i<shellPool.length;i++){
        if(!shellPool[i].active){shell=shellPool[i];break;}
    }
    if(!shell)return;
    shell.active=true;
    shell.x=x;shell.y=y;shell.z=z;
    const speed=0.18+Math.random()*0.08;
    shell.vx=dirRight.x*speed+(Math.random()-0.5)*0.06;
    shell.vy=0.22+dirUp.y*0.08+Math.random()*0.06;
    shell.vz=dirRight.z*speed+(Math.random()-0.5)*0.06;
    shell.rx=(Math.random()-0.5)*0.25;
    shell.ry=(Math.random()-0.5)*0.25;
    shell.rz=(Math.random()-0.5)*0.25;
    shell.life=120;
    shell.mesh.position.set(x,y,z);
    shell.mesh.rotation.set(Math.PI/2+Math.random()*0.5,Math.random()*Math.PI,0);
    shell.mesh.visible=true;
    activeShells.push(shell);
}

function updateEjectedShells(){
    for(let i=activeShells.length-1;i>=0;i--){
        const s=activeShells[i];
        s.life--;
        s.vy-=0.012;
        s.x+=s.vx;s.y+=s.vy;s.z+=s.vz;
        s.mesh.position.set(s.x,s.y,s.z);
        s.mesh.rotation.x+=s.rx;
        s.mesh.rotation.y+=s.ry;
        s.mesh.rotation.z+=s.rz;
        if(s.y<=0.03){
            s.y=0.03;
            s.vy=-s.vy*0.35;
            s.vx*=0.6;s.vz*=0.6;
            s.rx*=0.8;s.ry*=0.8;s.rz*=0.8;
        }
        if(s.life<=0){
            s.mesh.visible=false;
            s.active=false;
            activeShells.splice(i,1);
        }
    }
}

function startReload(){
    if(isFrozen)return;
    if(isReloading||ammo>=maxAmmo)return;
    if(reloadTimer){clearInterval(reloadTimer);reloadTimer=null;}
    isReloading=true;
    reloadType=ammo===1?'tactical':'full';
    const reloadTime=reloadType==='tactical'?1750:2500;
    ammoToEject=0;
    if(barrel1Spent)ammoToEject++;
    if(barrel2Spent)ammoToEject++;
    reloadProgress=0;
    let loadedCount=0;
    lastReloadBarPct=-1;lastLoadBarPct=-1;
    if(gameStarted)reloadBarContainer.classList.add('active');
    setReloadBar(0);
    let startTime=Date.now();
    reloadTimer=setInterval(()=>{
        const elapsed=Date.now()-startTime;
        reloadProgress=elapsed/reloadTime;
        setReloadBar(reloadProgress*100);
        const openEnd=500/reloadTime;
        const load2End=reloadType==='full'?2000/reloadTime:1250/reloadTime;
        const closeEnd=1;
        if(reloadProgress<openEnd){
            const t=reloadProgress/openEnd;
            barrelGroup.rotation.x=t*Math.PI/3;
        }else if(reloadProgress<load2End){
            barrelGroup.rotation.x=Math.PI/3;
        }else{
            const t=(reloadProgress-load2End)/(closeEnd-load2End);
            barrelGroup.rotation.x=(1-t)*Math.PI/3;
        }
        if(reloadProgress>=openEnd*0.3&&ammoToEject>0){
            const hingeX=player.x+0.25*Math.cos(aimYaw)+0.35*Math.sin(aimYaw);
            const hingeY=player.y+currentH-0.45;
            const hingeZ=player.z+0.25*Math.sin(aimYaw)-0.35*Math.cos(aimYaw);
            const rightDirX=Math.cos(aimYaw);
            const rightDirZ=-Math.sin(aimYaw);
            for(let i=0;i<ammoToEject;i++){
                const ex=hingeX+rightDirX*(0.05+0.03*i);
                const ey=hingeY+0.08+0.03*i;
                const ez=hingeZ+rightDirZ*(0.05+0.03*i);
                createEjectedShell(ex,ey,ez,{x:rightDirX,y:0,z:rightDirZ},{x:0,y:1,z:0});
            }
            barrel1Spent=false;barrel2Spent=false;ammoToEject=0;
        }
        const loadDuration=load2End-openEnd;
        const roundDuration=reloadType==='full'?loadDuration/2:loadDuration;
        if(reloadProgress>=openEnd&&reloadProgress<load2End){
            loadBarContainer.classList.add('active');
            const loadElapsed=reloadProgress-openEnd;
            const roundIndex=Math.floor(loadElapsed/roundDuration);
            const roundPct=(loadElapsed%roundDuration)/roundDuration;
            setLoadBar(roundPct*100);
            const targetBarrel=roundIndex===0?0:1;
            if(reloadShellMesh===null||reloadShellTargetBarrel!==targetBarrel){
                if(reloadShellMesh)gunGroup.remove(reloadShellMesh);
                reloadShellMesh=new THREE.Mesh(shellGeo,shellMat);
                reloadShellMesh.rotation.x=Math.PI/2;
                reloadShellTargetBarrel=targetBarrel;
                gunGroup.add(reloadShellMesh);
            }
            const startX=0.18,startY=-0.35,startZ=0.45;
            const targetX=0,targetY=targetBarrel===0?0.06:-0.06,targetZ=-0.42;
            const t=1-Math.pow(1-roundPct,2.5);
            reloadShellMesh.position.x=startX+(targetX-startX)*t;
            reloadShellMesh.position.y=startY+(targetY-startY)*t;
            reloadShellMesh.position.z=startZ+(targetZ-startZ)*t;
            if(roundPct>0.92)reloadShellMesh.scale.setScalar(1-(roundPct-0.92)/0.08);
        }else{
            loadBarContainer.classList.remove('active');
            setLoadBar(0);
            if(reloadShellMesh){gunGroup.remove(reloadShellMesh);reloadShellMesh=null;}
        }
        if(reloadType==='full'){
            if(reloadProgress>=openEnd+roundDuration&&loadedCount<1&&!barrel1HasShell){
                loadedCount=1;barrel1HasShell=true;ammo=1;nextBarrel=1;updateAmmoDisplay();
            }
            if(reloadProgress>=openEnd+roundDuration*2&&loadedCount<2&&!barrel2HasShell){
                loadedCount=2;barrel2HasShell=true;ammo=2;nextBarrel=0;updateAmmoDisplay();
            }
        }else{
            if(reloadProgress>=openEnd+roundDuration&&loadedCount<1&&!barrel1HasShell){
                loadedCount=1;barrel1HasShell=true;ammo=2;nextBarrel=0;updateAmmoDisplay();
            }
        }
        if(reloadProgress>=1)finishReload();
    },16);
}

function finishReload(){
    clearInterval(reloadTimer);
    reloadTimer=null;
    isReloading=false;
    reloadProgress=0;
    reloadType='';
    barrelGroup.rotation.x=0;
    ammo=maxAmmo;nextBarrel=0;
    barrel1HasShell=true;barrel2HasShell=true;
    barrel1Spent=false;barrel2Spent=false;ammoToEject=0;
    if(reloadShellMesh){gunGroup.remove(reloadShellMesh);reloadShellMesh=null;}
    reloadShellTargetBarrel=0;
    updateAmmoDisplay();
    if(gameStarted){
        reloadBarContainer.classList.remove('active');
        loadBarContainer.classList.remove('active');
    }
    setReloadBar(0);setLoadBar(0);
    if(reloadShellMesh){gunGroup.remove(reloadShellMesh);reloadShellMesh=null;}
}

function interruptReload(){
    if(!isReloading)return;
    clearInterval(reloadTimer);reloadTimer=null;
    isReloading=false;reloadProgress=0;reloadType='';
    barrelGroup.rotation.x=0;
    if(gameStarted){
        reloadBarContainer.classList.remove('active');
        loadBarContainer.classList.remove('active');
    }
    setReloadBar(0);setLoadBar(0);
    if(reloadShellMesh){gunGroup.remove(reloadShellMesh);reloadShellMesh=null;}
    reloadShellTargetBarrel=0;
    if(ammoToEject>0){
        const hingeX=player.x+0.25*Math.cos(aimYaw)+0.35*Math.sin(aimYaw);
        const hingeY=player.y+currentH-0.45;
        const hingeZ=player.z+0.25*Math.sin(aimYaw)-0.35*Math.cos(aimYaw);
        const rightDirX=Math.cos(aimYaw);
        const rightDirZ=-Math.sin(aimYaw);
        for(let i=0;i<ammoToEject;i++){
            const ex=hingeX+rightDirX*(0.05+0.03*i);
            const ey=hingeY+0.08+0.03*i;
            const ez=hingeZ+rightDirZ*(0.05+0.03*i);
            createEjectedShell(ex,ey,ez,{x:rightDirX,y:0,z:rightDirZ},{x:0,y:1,z:0});
        }
    }
    barrel1Spent=false;barrel2Spent=false;ammoToEject=0;
    ammo=(barrel1HasShell?1:0)+(barrel2HasShell?1:0);
    nextBarrel=barrel1HasShell?1:0;
    if(nextBarrel===1&&!barrel2HasShell)nextBarrel=0;
    updateAmmoDisplay();
}

function createBulletHole(x,y,z,normal,color){
    let hole=null;
    for(let i=0;i<holePool.length;i++){
        if(!holePool[i].active){hole=holePool[i];break;}
    }
    if(!hole){
        let oldestIdx=0,oldestLife=Infinity;
        for(let i=0;i<holePool.length;i++){
            if(holePool[i].life<oldestLife){oldestLife=holePool[i].life;oldestIdx=i;}
        }
        hole=holePool[oldestIdx];
        const idx=activeHoles.indexOf(hole);
        if(idx>=0)activeHoles.splice(idx,1);
    }
    hole.active=true;hole.life=300;
    hole.mesh.material=(color==='#3d2817')?holeMatBox:holeMatGround;
    hole.mesh.position.set(x,y+0.01,z);
    if(normal)hole.mesh.lookAt(x+normal.x,y+normal.y+1,z+normal.z);
    hole.mesh.material.opacity=0.7;
    hole.mesh.visible=true;
    activeHoles.push(hole);
}

function updateBulletHoles(){
    for(let i=activeHoles.length-1;i>=0;i--){
        const h=activeHoles[i];
        h.life--;
        h.mesh.material.opacity=h.life/300*0.7;
        if(h.life<=0){
            h.mesh.visible=false;h.active=false;
            activeHoles.splice(i,1);
        }
    }
}

const raycaster=new THREE.Raycaster();

function getAimTarget(){
    sharedRaycaster.setFromCamera(_v2Center,camera);
    const intersects=sharedRaycaster.intersectObjects([ground,...boxes]);
    if(intersects.length>0){
        const hit=intersects[0];
        const dist=hit.distance;
        if(dist<100)return{point:hit.point,distance:dist,normal:hit.face.normal,object:hit.object};
    }
    const dir=getV3();
    camera.getWorldDirection(dir);
    const farPoint=getV3().copy(camera.position).add(dir.multiplyScalar(100));
    return{point:farPoint,distance:100,normal:_v3Normal,object:null};
}

function getSpreadAngle(){
    let spreadDeg=3.0;
    if(player.isCrouching){
        spreadDeg=(Math.abs(player.vx)>0.001||Math.abs(player.vz)>0.001)?4.0:1.5;
    }else if(player.isSprinting){
        spreadDeg=10.0;
    }else if(Math.abs(player.vx)>0.001||Math.abs(player.vz)>0.001){
        spreadDeg=6.0;
    }
    return spreadDeg*Math.PI/180;
}

function fire(){
    if(isFrozen)return;
    if(isReloading)interruptReload();
    if(ammo<=0)return;
    if(nextBarrel===0&&!barrel1HasShell)nextBarrel=1;
    if(nextBarrel===1&&!barrel2HasShell)nextBarrel=0;
    if(!barrel1HasShell&&!barrel2HasShell)return;

    const firedBarrel=nextBarrel;
    nextBarrel=ammo>0?(firedBarrel===0?1:0):0;
    if(firedBarrel===0){barrel1HasShell=false;barrel1Spent=true;}
    else{barrel2HasShell=false;barrel2Spent=true;}
    ammo--;updateAmmoDisplay();

    recoilPitch=Math.min(recoilPitch+RECOIL_PITCH_PER_SHOT,RECOIL_MAX_PITCH);
    recoilKick=Math.min(recoilKick+RECOIL_KICK_PER_SHOT,RECOIL_MAX_KICK);
    screenShake=Math.min(screenShake+0.28,SHAKE_MAX);
    createMuzzleFlash();

    const aimTarget=getAimTarget();
    const spreadAngle=getSpreadAngle();
    const barrelOffsetY=firedBarrel===0?0.06:-0.06;
    const muzzleLocal=getV3().set(0,barrelOffsetY,-0.7);
    playerGroup.updateMatrixWorld();
    gunGroup.updateMatrixWorld();
    const muzzleWorld=muzzleLocal.clone().applyMatrix4(gunGroup.matrixWorld);
    const muzzleX=muzzleWorld.x,muzzleY=muzzleWorld.y,muzzleZ=muzzleWorld.z;
    const targetDir=getV3().subVectors(aimTarget.point,muzzleWorld).normalize();

    for(let i=0;i<7;i++){
        const cosMax=Math.cos(spreadAngle);
        const cosPhi=cosMax+Math.random()*(1-cosMax);
        const sinPhi=Math.sqrt(1-cosPhi*cosPhi);
        const theta=Math.random()*Math.PI*2;
        const cosTheta=Math.cos(theta),sinTheta=Math.sin(theta);
        const up=getV3().set(0,1,0);
        let right=getV3().crossVectors(targetDir,up).normalize();
        if(right.lengthSq()<0.001)right.set(1,0,0);
        const up2=getV3().crossVectors(right,targetDir).normalize();
        const bulletDir=getV3().copy(targetDir).multiplyScalar(cosPhi);
        bulletDir.add(getV3().copy(right).multiplyScalar(sinPhi*cosTheta));
        bulletDir.add(getV3().copy(up2).multiplyScalar(sinPhi*sinTheta));
        bulletDir.normalize();

        let bullet=null;
        for(let j=0;j<bulletPool.length;j++){
            if(!bulletPool[j].active){bullet=bulletPool[j];break;}
        }
        if(!bullet)continue;
        bullet.active=true;
        bullet.x=muzzleX;bullet.y=muzzleY;bullet.z=muzzleZ;
        bullet.vx=bulletDir.x*2.5;bullet.vy=bulletDir.y*2.5;bullet.vz=bulletDir.z*2.5;
        bullet.life=120;bullet.distanceTraveled=0;
        bullet.effectiveRange=17+Math.random();
        bullet.targetPoint=aimTarget.point.clone();
        bullet.mesh.position.set(muzzleX,muzzleY,muzzleZ);
        bullet.mesh.visible=true;
        activeBullets.push(bullet);
    }
}

function updateBullets(){
    for(let i=activeBullets.length-1;i>=0;i--){
        const b=activeBullets[i];
        b.life--;
        const moveDist=Math.sqrt(b.vx*b.vx+b.vy*b.vy+b.vz*b.vz);
        b.distanceTraveled+=moveDist;
        if(b.distanceTraveled>b.effectiveRange)b.vy-=0.008;
        b.x+=b.vx;b.y+=b.vy;b.z+=b.vz;
        b.mesh.position.set(b.x,b.y,b.z);
        const bChunk=getChunkIndex(b.z);
        let hitBox=false;
        for(let box of boxes){
            const boxChunk=box.userData.chunkIndex;
            if(boxChunk<bChunk-1||boxChunk>bChunk+1)continue;
            const min=box.userData.min,max=box.userData.max;
            if(b.x>min.x&&b.x<max.x&&b.y>min.y&&b.y<max.y&&b.z>min.z&&b.z<max.z){
                hitBox=true;createBulletHole(b.x,b.y,b.z,_v3Normal,'#3d2817');break;
            }
        }
        if(!hitBox&&b.y<=0.025){
            b.y=0.025;b.vy=0;b.vx=0;b.vz=0;
            createBulletHole(b.x,0,b.z,_v3Normal,'#1a1a1a');
        }
        if(b.life<=0||Math.abs(b.x-player.x)>150||Math.abs(b.z-player.z)>150||hitBox){
            b.mesh.visible=false;b.active=false;
            activeBullets.splice(i,1);
        }
    }
}

function updateJoystick(cx,cy){
    const dx=cx-joyCenter.x,dy=cy-joyCenter.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const norm=Math.min(dist,joyMaxR)/joyMaxR;
    const ang=Math.atan2(dy,dx);
    const clamped=Math.min(dist,joyMaxR);
    joystickKnob.style.transform=`translate(calc(-50% + ${Math.cos(ang)*clamped}px), calc(-50% + ${Math.sin(ang)*clamped}px))`;
    input.joystick.x=Math.cos(ang)*norm;
    input.joystick.y=Math.sin(ang)*norm;
    input.joystick.active=true;
}

function checkPlayerCollision(newX,newZ){
    const playerRadius=0.4;
    const pChunk=getChunkIndex(player.z);
    for(let box of boxes){
        const boxChunk=box.userData.chunkIndex;
        if(boxChunk<pChunk-2||boxChunk>pChunk+2)continue;
        const min=box.userData.min,max=box.userData.max;
        if(newX+playerRadius>min.x&&newX-playerRadius<max.x&&newZ+playerRadius>min.z&&newZ-playerRadius<max.z&&player.y<max.y&&player.y+currentH>min.y)return true;
    }
    return false;
}

function getGroundHeight(x,z){
    if(player.y > 15) return 0;
    let groundY=0;
    const playerRadius=0.4;
    const pChunk=getChunkIndex(player.z);
    for(let box of boxes){
        const boxChunk=box.userData.chunkIndex;
        if(boxChunk<pChunk-2||boxChunk>pChunk+2)continue;
        const min=box.userData.min,max=box.userData.max;
        if(x+playerRadius>min.x&&x-playerRadius<max.x&&z+playerRadius>min.z&&z-playerRadius<max.z){
            if(max.y<=player.y+0.6&&max.y>groundY)groundY=max.y;
        }
    }
    return groundY;
}

function updatePlayerVisuals(){
    currentH+=(targetH-currentH)*0.15;
    joints.wholeX.node.scale.set(1,1,1);

    const clampedHeadYaw=Math.max(-1.2,Math.min(1.2,headYawTarget));
    joints.headY.node.rotation.y+=(clampedHeadYaw-joints.headY.node.rotation.y)*0.12;
    joints.headX.node.rotation.x+=(-aimPitch*0.3-joints.headX.node.rotation.x)*0.12;
    recoilPitch*=(1-recoilRecoverySpeed);
    recoilKick*=(1-recoilRecoverySpeed);
    if(recoilPitch<0.001)recoilPitch=0;
    if(recoilKick<0.001)recoilKick=0;
    gunGroup.position.set(0.25,currentH-0.15+recoilKick*0.2,-0.65-recoilKick);
    const targetPitch=aimPitch+recoilPitch;
    gunGroup.rotation.x+=(targetPitch-gunGroup.rotation.x)*0.18;
    if(isReloading){
        if(reloadProgress<0.25)gunGroup.rotation.x+=reloadProgress/0.25*0.1;
        else if(reloadProgress>0.75)gunGroup.rotation.x+=(1-reloadProgress)/0.25*0.1;
    }
    const t=performance.now()*0.008;
    const isMoving=Math.abs(player.vx)>0.001||Math.abs(player.vz)>0.001;
    const isRunning=player.isSprinting;
    const GUN_LSX=RAD_37,GUN_LSZ=RAD_9,GUN_LSY=0,GUN_LE=RAD_125;
    const GUN_RSX=RAD_60,GUN_RSZ=RAD_34,GUN_RSY=0,GUN_RE=0;
    if(player.isCrouching){
        joints.wholeY.node.rotation.x=0;
        joints.lHipX.node.rotation.x=RAD_75;
        joints.rHipX.node.rotation.x=RAD_75;
        joints.lKnee.node.rotation.x=RAD_360_115;
        joints.rKnee.node.rotation.x=RAD_360_115;
        joints.spineX.node.rotation.x=RAD_75;
        joints.headX.node.rotation.x=-RAD_75;
        const breathe=Math.sin(t*0.8)*2;
        joints.wholeX.node.position.y=-0.55;
        joints.lShoulderX.node.rotation.x=GUN_LSX+RAD_10+breathe;
        joints.lShoulderZ.node.rotation.z=GUN_LSZ;
        joints.lElbow.node.rotation.x=GUN_LE+breathe*0.5;
        joints.rShoulderX.node.rotation.x=GUN_RSX+RAD_45+breathe;
        joints.rShoulderZ.node.rotation.z=GUN_RSZ;
        joints.rElbow.node.rotation.x=GUN_RE+breathe*0.5;
        gunGroup.position.set(0.2,currentH+0.18,-0.55);
    }else if(isMoving){
        if(isRunning){
            const c=t*2;
            joints.spineX.node.rotation.x=RAD_15;
            joints.lHipX.node.rotation.x=-RAD_30+Math.sin(c)*RAD_31;
            joints.lKnee.node.rotation.x=Math.max(0,Math.sin(c-0.5)*RAD_56);
            joints.rHipX.node.rotation.x=-RAD_30+Math.sin(c+Math.PI)*RAD_31;
            joints.rKnee.node.rotation.x=Math.max(0,Math.sin(c+Math.PI-0.5)*RAD_56);
            const armBob=Math.sin(c)*RAD_1_5;
            joints.lShoulderX.node.rotation.x=GUN_LSX+armBob;
            joints.lShoulderZ.node.rotation.z=GUN_LSZ;
            joints.lElbow.node.rotation.x=GUN_LE+armBob*0.3;
            joints.rShoulderX.node.rotation.x=GUN_RSX+armBob;
            joints.rShoulderZ.node.rotation.z=GUN_RSZ;
            joints.rElbow.node.rotation.x=GUN_RE+armBob*0.3;
            joints.wholeX.node.position.y=0;
        }else{
            const c=t;
            joints.spineX.node.rotation.x=RAD_5;
            joints.lHipX.node.rotation.x=-RAD_10+Math.sin(c)*RAD_12;
            joints.lKnee.node.rotation.x=Math.max(0,Math.sin(c-0.5)*RAD_20);
            joints.rHipX.node.rotation.x=-RAD_10+Math.sin(c+Math.PI)*RAD_12;
            joints.rKnee.node.rotation.x=Math.max(0,Math.sin(c+Math.PI-0.5)*RAD_20);
            const armBob=Math.sin(c)*D2R;
            joints.lShoulderX.node.rotation.x=GUN_LSX+armBob;
            joints.lShoulderZ.node.rotation.z=GUN_LSZ;
            joints.lElbow.node.rotation.x=GUN_LE+armBob*0.3;
            joints.rShoulderX.node.rotation.x=GUN_RSX+armBob;
            joints.rShoulderZ.node.rotation.z=GUN_RSZ;
            joints.rElbow.node.rotation.x=GUN_RE+armBob*0.3;
            joints.wholeX.node.position.y=0;
        }
    }else{
        const breathe=Math.sin(t*0.5)*RAD_1_5;
        joints.lShoulderX.node.rotation.x=GUN_LSX+breathe;
        joints.lShoulderZ.node.rotation.z=GUN_LSZ;
        joints.lShoulderY.node.rotation.y=GUN_LSY;
        joints.lElbow.node.rotation.x=GUN_LE+breathe*0.5;
        joints.rShoulderX.node.rotation.x=GUN_RSX+breathe;
        joints.rShoulderZ.node.rotation.z=GUN_RSZ;
        joints.rShoulderY.node.rotation.y=GUN_RSY;
        joints.rElbow.node.rotation.x=GUN_RE+breathe*0.5;
        joints.wholeY.node.rotation.x=0;
        joints.spineX.node.rotation.x=0;
        joints.spineY.node.rotation.y=0;
        joints.lHipX.node.rotation.x=0;
        joints.lHipZ.node.rotation.z=0;
        joints.lHipY.node.rotation.y=0;
        joints.lKnee.node.rotation.x=0;
        joints.rHipX.node.rotation.x=0;
        joints.rHipZ.node.rotation.z=0;
        joints.rHipY.node.rotation.y=0;
        joints.rKnee.node.rotation.x=0;
        joints.wholeX.node.position.y=0;
    }
    joints.wholeZ.node.rotation.z=Math.sin(t*0.5)*0.5*D2R;
    if(player.isCrouching&&player.y>0.01){player.y*=0.9;if(player.y<0.01)player.y=0;}
    updateMuzzleFlash();
}

// ==================== 枪口特效 ====================
function createMuzzleFlash(){
    const firedBarrel=nextBarrel===0?1:0;
    const actualBarrelY=firedBarrel===0?0.06:-0.06;
    const muzzleLocal=getV3().set(0,actualBarrelY,-0.7);
    playerGroup.updateMatrixWorld();
    gunGroup.updateMatrixWorld();
    const muzzleWorld=muzzleLocal.clone().applyMatrix4(gunGroup.matrixWorld);

    if(!muzzleFlash){
        const flashGeo=new THREE.PlaneGeometry(2.5,2.5);
        const flashMat=new THREE.MeshBasicMaterial({color:0xffffee,transparent:true,opacity:1,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending});
        muzzleFlash=new THREE.Mesh(flashGeo,flashMat);
        scene.add(muzzleFlash);
        muzzleFlashLight=new THREE.PointLight(0xffcc66,0,0,1);
        scene.add(muzzleFlashLight);
    }
    muzzleFlash.position.copy(muzzleWorld);
    const flashForward=getV3().set(0,0,-1).applyQuaternion(gunGroup.quaternion).applyQuaternion(playerGroup.quaternion);
    muzzleFlash.lookAt(muzzleWorld.x+flashForward.x,muzzleWorld.y+flashForward.y,muzzleWorld.z+flashForward.z);
    muzzleFlash.material.opacity=1;
    muzzleFlash.visible=true;
    muzzleFlashLight.position.copy(muzzleWorld);
    muzzleFlashLight.intensity=80;

    const smokeGeo=new THREE.PlaneGeometry(0.15,0.15);
    const smokeMat=new THREE.MeshBasicMaterial({color:0xaaaaaa,transparent:true,opacity:0.4,side:THREE.DoubleSide,depthWrite:false});
    const smoke=new THREE.Mesh(smokeGeo,smokeMat);
    smoke.position.copy(muzzleWorld);
    const forward=getV3().set(0,0,-1).applyQuaternion(gunGroup.quaternion);
    forward.applyQuaternion(playerGroup.quaternion);
    scene.add(smoke);
    muzzleSmoke.push({mesh:smoke,vx:forward.x*0.03+(Math.random()-0.5)*0.02,vy:forward.y*0.03+Math.random()*0.02,vz:forward.z*0.03+(Math.random()-0.5)*0.02,life:30,maxLife:30});
}

function updateMuzzleFlash(){
    if(muzzleFlash&&muzzleFlash.visible){
        muzzleFlash.material.opacity-=0.08;
        muzzleFlashLight.intensity*=0.45;
        if(muzzleFlash.material.opacity<=0){
            muzzleFlash.visible=false;
            muzzleFlashLight.intensity=0;
        }
    }
    for(let i=muzzleSmoke.length-1;i>=0;i--){
        const s=muzzleSmoke[i];
        s.life--;
        s.mesh.position.x+=s.vx;
        s.mesh.position.y+=s.vy;
        s.mesh.position.z+=s.vz;
        s.mesh.rotation.z+=0.1;
        s.mesh.scale.setScalar(1+(s.maxLife-s.life)/s.maxLife*3);
        s.mesh.material.opacity=(s.life/s.maxLife)*0.3;
        s.mesh.lookAt(camera.position);
        if(s.life<=0){scene.remove(s.mesh);muzzleSmoke.splice(i,1);}
    }
}

function updateGameTime(dt){
    if(!dt||dt<0)dt=0;
    if(dt>1000)dt=1000;
    gameTime+=(dt/1000)*REAL_SEC_PER_GAME_MIN;
    if(gameTime>=DAY_LENGTH_MIN)gameTime-=DAY_LENGTH_MIN;
    if(watchPressed){
        const h=Math.floor(gameTime/60),m=Math.floor(gameTime%60);
        timeDisplay.innerHTML=(h<10?'0'+h:h)+':'+(m<10?'0'+m:m);
    }
    updateEnvironment();
}

function lerpColor(c1,c2,t){
    const r1=(c1>>16)&0xff,g1=(c1>>8)&0xff,b1=c1&0xff;
    const r2=(c2>>16)&0xff,g2=(c2>>8)&0xff,b2=c2&0xff;
    const r=Math.round(r1+(r2-r1)*t);
    const g=Math.round(g1+(g2-g1)*t);
    const b=Math.round(b1+(b2-b1)*t);
    return(r<<16)|(g<<8)|b;
}

let lastEnvUpdateTime=-999;
function updateEnvironment(){
    if(Math.abs(gameTime-lastEnvUpdateTime)<0.5)return;
    lastEnvUpdateTime=gameTime;
    let phaseA=null,phaseB=null,t=0;
    const phases=[TIME_PHASES.NIGHT,TIME_PHASES.DAWN,TIME_PHASES.MORNING,TIME_PHASES.DAY,TIME_PHASES.DUSK,TIME_PHASES.EVENING,TIME_PHASES.NIGHT2];
    for(let i=0;i<phases.length;i++){
        const p=phases[i];
        if(gameTime>=p.start&&gameTime<p.end){
            phaseA=p;phaseB=phases[(i+1)%phases.length];
            t=(gameTime-p.start)/(p.end-p.start);break;
        }
    }
    if(!phaseA)return;
    const fogColor=lerpColor(phaseA.fogColor,phaseB.fogColor,t);
    const bgColor=lerpColor(phaseA.bgColor,phaseB.bgColor,t);
    const ambientColor=lerpColor(phaseA.ambientColor,phaseB.ambientColor,t);
    const dirColor=lerpColor(phaseA.dirColor,phaseB.dirColor,t);
    const ambientInt=phaseA.ambientInt+(phaseB.ambientInt-phaseA.ambientInt)*t;
    const dirInt=phaseA.dirInt+(phaseB.dirInt-phaseA.dirInt)*t;
    const fogNear=phaseA.fogNear+(phaseB.fogNear-phaseA.fogNear)*t;
    const fogFar=phaseA.fogFar+(phaseB.fogFar-phaseA.fogFar)*t;

    scene.fog.color.setHex(fogColor);
    scene.background.setHex(bgColor);
    ambientLight.color.setHex(ambientColor);
    ambientLight.intensity=ambientInt;
    dirLightRef.color.setHex(dirColor);
    dirLightRef.intensity=dirInt;
    scene.fog.near=fogNear;
    scene.fog.far=fogFar;

    const sunAngle=(gameTime/DAY_LENGTH_MIN)*Math.PI*2-Math.PI/2;
    const sunHeight=Math.sin(sunAngle)*80+20;
    const sunX=Math.cos(sunAngle)*60;
    const sunZ=Math.sin(sunAngle)*30;
    dirLightRef.position.set(sunX,Math.max(sunHeight,10),sunZ);
}

let lastPlayerX=0,lastPlayerY=0,lastPlayerZ=0;

const FIXED_DT=1000/60;
let physicsAccumulator=0;

function update(dt){
    if(gameOver)return;
if(isFrozen){
        updatePlayerVisuals();
        const cosP=Math.cos(aimPitch),sinP=Math.sin(aimPitch);
        const camDist=camCfg.distance,camHeight=camCfg.height;
        const pivotX=player.x;
        const pivotY=player.y+currentH*0.5+0.3;
        const pivotZ=player.z;
        const backX=Math.sin(aimYaw)*camDist;
        const backZ=Math.cos(aimYaw)*camDist;
        const targetCamX=pivotX+backX*cosP;
        const targetCamY=pivotY+camHeight+sinP*camDist*0.5;
        const targetCamZ=pivotZ+backZ*cosP;
        camera.position.set(targetCamX,targetCamY,targetCamZ);
        const aimPX=player.x-Math.sin(aimYaw)*cosP*camCfg.aimDist;
        const aimPY=player.y+sinP*camCfg.aimDist;
        const aimPZ=player.z-Math.cos(aimYaw)*cosP*camCfg.aimDist;
        camera.lookAt(aimPX,aimPY,aimPZ);
        updateMuzzleFlash();
        updateFPS();
        renderer.render(scene,camera);
        return;
    }
    updateGameTime(dt);
    updatePlayerVisuals();
    updateBullets();
    updateEjectedShells();
    updateBulletHoles();
    updateFPS();
    physicsAccumulator+=dt;
    if(physicsAccumulator>FIXED_DT*5)physicsAccumulator=FIXED_DT*5;
    while(physicsAccumulator>=FIXED_DT){
        stepPhysics();
        physicsAccumulator-=FIXED_DT;
    }
    updateCamera();
    updateCompass();
    updateHpDisplay();
    updateDamageEffects();
    updateMuzzleFlash();
}

function stepPhysics(){
    let speed=player.normalSpeed;
    if(player.isCrouching){speed=player.crouchSpeed;player.isSprinting=false;}
    else if(input.sprint){speed=player.sprintSpeed;player.isSprinting=true;}
    else{player.isSprinting=false;}

    let inForward=0,inRight=0;
    if(keys['w']||keys['arrowup'])inForward+=1;
    if(keys['s']||keys['arrowdown'])inForward-=1;
    if(keys['a']||keys['arrowleft'])inRight-=1;
    if(keys['d']||keys['arrowright'])inRight+=1;
    if(input.joystick.active){inForward=-input.joystick.y;inRight=input.joystick.x;}

    const len=Math.sqrt(inForward*inForward+inRight*inRight);
    if(len>0.01){
        const f=inForward/len,r=inRight/len;
        const faceX=-Math.sin(aimYaw),faceZ=-Math.cos(aimYaw);
        const rightX=Math.cos(aimYaw),rightZ=-Math.sin(aimYaw);
        const newVx=(f*faceX+r*rightX)*speed;
        const newVz=(f*faceZ+r*rightZ)*speed;
        const newX=player.x+newVx;
        const newZ=player.z+newVz;
        if(!checkPlayerCollision(newX,player.z)){player.vx=newVx;player.x=newX;}
        else{player.vx=0;}
        if(!checkPlayerCollision(player.x,newZ)){player.vz=newVz;player.z=newZ;}
        else{player.vz=0;}
    }else{player.vx=0;player.vz=0;}

    if(input.jump&&player.isGrounded){if(player.isCrouching){player.isCrouching=false;input.crouch=false;crouchBtn.classList.remove('crouching');targetH=normalH;}player.vy=player.jumpForce;player.isGrounded=false;}
    player.vy-=player.gravity;player.y+=player.vy;
    const groundH=getGroundHeight(player.x,player.z);
    if(player.y<=groundH){player.y=groundH;player.vy=0;player.isGrounded=true;}

    playerGroup.position.set(player.x,player.y,player.z);
    playerGroup.rotation.y=aimYaw;

    playerMoved=(Math.abs(player.x-lastPlayerX)>0.001||Math.abs(player.z-lastPlayerZ)>0.001||Math.abs(player.y-lastPlayerY)>0.001);
    if(playerMoved){lastPlayerX=player.x;lastPlayerY=player.y;lastPlayerZ=player.z;}
}

let lastCamSafeX=0,lastCamSafeY=0,lastCamSafeZ=0;

function updateCamera(){
    const cosP=Math.cos(aimPitch),sinP=Math.sin(aimPitch);
    const camDist=camCfg.distance,camHeight=camCfg.height,camRight=camCfg.rightOffset;
    const pivotX=player.x+camRight*Math.cos(aimYaw);
    const pivotY=player.y+currentH+0.3;
    const pivotZ=player.z-camRight*Math.sin(aimYaw);
    const backX=Math.sin(aimYaw)*camDist;
    const backZ=Math.cos(aimYaw)*camDist;
    const crouchRatio=(normalH-currentH)/(normalH-crouchH);
    const camHeightDrop=crouchRatio*(camCfg.crouchCamDrop+0.3);

    const targetCamX=pivotX+backX*cosP;
    const targetCamY=pivotY+camHeight-camHeightDrop+sinP*camDist*0.5;
    const targetCamZ=pivotZ+backZ*cosP;

    let desiredX=targetCamX,desiredY=targetCamY,desiredZ=targetCamZ;

    // 每帧都进行碰撞检测，避免3帧间隔导致的跳变
    const camOrigin=getV3().set(pivotX,pivotY,pivotZ);
    const camTargetPos=getV3().set(targetCamX,targetCamY,targetCamZ);
    const camDirVec=getV3().subVectors(camTargetPos,camOrigin).normalize();
    const camDistTotal=camOrigin.distanceTo(camTargetPos);

    if(camDistTotal>0.1){
        const pChunk=getChunkIndex(player.z);
        const nearbyBoxes=[];
        for(let box of boxes){
            const bChunk=box.userData.chunkIndex;
            if(bChunk>=pChunk-2&&bChunk<=pChunk+2)nearbyBoxes.push(box);
        }
        camRaycaster.set(camOrigin,camDirVec);
        const camHits=camRaycaster.intersectObjects(nearbyBoxes,false);
        if(camHits.length>0&&camHits[0].distance<camDistTotal){
            const hitDist=camHits[0].distance;
            const minCamDist=0.8;
            if(hitDist>minCamDist){
                const safeDist=hitDist-0.3;
                desiredX=camOrigin.x+camDirVec.x*safeDist;
                desiredY=camOrigin.y+camDirVec.y*safeDist;
                desiredZ=camOrigin.z+camDirVec.z*safeDist;
            }else{
                desiredX=pivotX;desiredZ=pivotZ;desiredY=pivotY+1.4;
            }
        }
    }

    // 平滑插值到desired位置，彻底消除闪跳
    const smoothFactor=0.35;
    let finalCamX=camera.position.x+(desiredX-camera.position.x)*smoothFactor;
    let finalCamY=camera.position.y+(desiredY-camera.position.y)*smoothFactor;
    let finalCamZ=camera.position.z+(desiredZ-camera.position.z)*smoothFactor;

    // 保存安全位置供其他逻辑使用
    lastCamSafeX=desiredX;lastCamSafeY=desiredY;lastCamSafeZ=desiredZ;

    if(screenShake>0.001){
        finalCamX+=(Math.random()-0.5)*screenShake;
        finalCamY+=(Math.random()-0.5)*screenShake;
        finalCamZ+=(Math.random()-0.5)*screenShake;
        screenShake*=(1-SHAKE_DECAY);
        if(screenShake<0.001)screenShake=0;
    }

    camera.position.set(finalCamX,finalCamY,finalCamZ);
    const aimPX=player.x-Math.sin(aimYaw)*cosP*camCfg.aimDist;
    const aimPY=player.y+sinP*camCfg.aimDist;
    const aimPZ=player.z-Math.cos(aimYaw)*cosP*camCfg.aimDist;
    camera.lookAt(aimPX,aimPY,aimPZ);
}

function typeText(element,text,speed,callback){
    isTyping=true;

    element.textContent='';

        if(!isTyping)return;
        if(i<text.length){
            element.textContent+=text.charAt(i);
            i++;
            typeTimer=setTimeout(typeChar,speed);
        }else{
            isTyping=false;
            if(callback)callback();
        }

function showNextStoryLine(){
    const overlay=document.getElementById('story-overlay');
    const textEl=document.getElementById('story-text');
    const skipHint=document.getElementById('story-skip-hint');
    isTyping=false;
    if(typeTimer)clearTimeout(typeTimer);

    if(storyPhase>=storyTexts.length){
        if(skipHint)skipHint.style.opacity='0';
        textEl.style.transition='opacity 0.8s ease';

    storyPhase++;
    textEl.style.transition='opacity 0.3s ease';
