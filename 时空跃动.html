<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>时空跃动</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #121212;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  color: #FFFFFF;
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}

/* ===== 开始界面（与原游戏一致；不含黑洞背景图，保证秒开） ===== */
#start-screen {
  position: absolute; inset: 0;
  z-index: 100;
  background: #0a0a0f;
  transition: opacity 0.5s;
  overflow: hidden;
}
/* 内容区暗角：上下渐变，增强纵深感（加载页不引黑洞背景图，保证秒开） */
#start-screen::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(10,10,15,0.6) 0%,
    rgba(10,10,15,0.2) 30%,
    rgba(10,10,15,0.1) 50%,
    rgba(10,10,15,0.5) 80%,
    rgba(10,10,15,0.85) 100%
  );
  z-index: 1;
  pointer-events: none;
}
#start-screen > * {
  position: relative;
  z-index: 2;
}
/* 内容容器：垂直重心 58% 黄金分割点 */
#start-screen .start-content {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding-bottom: 12vh;
  transition: transform 0.6s cubic-bezier(0.22, 0.9, 0.3, 1), opacity 0.4s ease;
  will-change: transform;
}
/* 横屏（宽>高）：内容靠右，垂直居中 */
@media (min-aspect-ratio: 1/1) {
  #start-screen .start-content {
    align-items: flex-end;
    justify-content: center;
    padding-right: 10vw;
    padding-bottom: 0;
    transform: translateX(0);
  }
}
/* 主标题 */
#start-screen .title {
  font-size: 64px; font-weight: 900;
  letter-spacing: 16px;
  color: #FFFFFF;
  text-shadow:
    0 0 40px rgba(0,246,255,0.25),
    0 0 80px rgba(0,246,255,0.1),
    0 2px 4px rgba(0,0,0,0.5);
  margin-bottom: 12px;
  animation: titleGlow 3s ease-in-out infinite alternate;
}
@keyframes titleGlow {
  from { text-shadow: 0 0 40px rgba(0,246,255,0.2), 0 0 80px rgba(0,246,255,0.08), 0 2px 4px rgba(0,0,0,0.5); }
  to   { text-shadow: 0 0 50px rgba(0,246,255,0.35), 0 0 100px rgba(0,246,255,0.15), 0 2px 4px rgba(0,0,0,0.5); }
}
/* 副标题 + 装饰线 */
#start-screen .subtitle {
  font-size: 13px; color: #6a7a78;
  letter-spacing: 6px; margin-bottom: 8px;
  text-transform: uppercase;
}
#start-screen .subtitle::after {
  content: '';
  display: block;
  width: 60px; height: 1px;
  margin: 16px auto 0;
  background: linear-gradient(to right, transparent, rgba(0,246,255,0.4), transparent);
}
/* 主 CTA：发光边框 + 扫光 */
#start-screen .btn-primary {
  padding: 16px 48px;
  font-size: 18px; font-weight: 700;
  letter-spacing: 6px;
  border: 2px solid rgba(0,246,255,0.6);
  background: rgba(0,246,255,0.06);
  color: #FFFFFF;
  cursor: pointer;
  transition: all 0.3s;
  border-radius: 4px;
  margin-top: 48px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  font-family: inherit;
}
#start-screen .btn-primary::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 40%, rgba(0,246,255,0.1) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.6s;
}
#start-screen .btn-primary:hover {
  background: rgba(0,246,255,0.12);
  border-color: #00F6FF;
  box-shadow: 0 0 30px rgba(0,246,255,0.2), inset 0 0 20px rgba(0,246,255,0.05);
}
#start-screen .btn-primary:hover::before {
  transform: translateX(100%);
}
#start-screen .btn-primary:active {
  transform: scale(0.96);
}
/* 次要按钮：幽灵弱化 */
#start-screen .btn-secondary {
  padding: 10px 28px;
  font-size: 13px;
  letter-spacing: 3px;
  border: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  transition: all 0.3s;
  border-radius: 4px;
  font-family: inherit;
}
#start-screen .btn-secondary:hover {
  border-color: rgba(255,255,255,0.4);
  color: rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.03);
}
/* 页脚 */
#start-screen .start-footer {
  position: absolute;
  bottom: 32px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 40px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.06);
  width: fit-content;
  margin: 0 auto;
}
/* 横屏：页脚跟随内容右对齐 */
@media (min-aspect-ratio: 1/1) {
  #start-screen .start-footer {
    left: auto;
    right: 10vw;
    margin: 0;
  }
}
.dev-info, .changelog-info {
  font-size: 11px;
  color: rgba(141,147,144,0.45);
  cursor: pointer;
  transition: color 0.3s;
  letter-spacing: 3px;
}
.dev-info:hover, .changelog-info:hover {
  color: #A0DAF7;
}

/* ===== 加载提示小窗 ===== */
#load-toast {
  position: fixed;
  top: 40px; left: 50%;
  transform: translate(-50%, -12px);
  padding: 10px 28px;
  font-size: 13px;
  letter-spacing: 4px;
  color: #FFFFFF;
  background: rgba(10,10,15,0.85);
  border: 1px solid rgba(0,246,255,0.35);
  border-radius: 4px;
  box-shadow: 0 0 24px rgba(0,246,255,0.12);
  opacity: 0;
  pointer-events: none;
  z-index: 999;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
#load-toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ==================== 响应式适配（与游戏逐行一致，切换后尺寸不变） ==================== */
@media (max-width: 768px) {
  #start-screen .title { font-size: 52px; letter-spacing: 12px; }
}
@media (max-width: 480px) {
  #start-screen .title { font-size: 42px; letter-spacing: 10px; }
  #start-screen .btn-primary { padding: 14px 36px; font-size: 16px; letter-spacing: 4px; }
  #start-screen .btn-secondary { padding: 8px 20px; font-size: 12px; }
  .start-footer { bottom: 24px; gap: 28px; }
}
@media (min-width: 1025px) {
  #start-screen .title { font-size: 72px; }
}
@media (max-height: 500px) and (orientation: landscape) {
  #start-screen .title { font-size: 40px; letter-spacing: 10px; }
  #start-screen .btn-primary { padding: 12px 32px; font-size: 15px; margin-top: 28px; }
  #start-screen .btn-secondary { padding: 8px 20px; font-size: 12px; }
  #start-screen .subtitle { margin-bottom: 4px; }
  #start-screen .subtitle::after { margin-top: 10px; }
}
</style>
</head>
<body>

<div id="start-screen">
  <div class="start-content">
    <div class="title">时空跃动</div>
    <div class="subtitle">SPACE TIME LEAP</div>
    <button class="btn-primary" id="btn-start-game" type="button">系统培训</button>
    <button class="btn-secondary" id="btn-lobby" type="button">时空中枢</button>
  </div>
  <div class="start-footer">
    <span class="dev-info" id="dev-info">开发人员</span>
    <span class="changelog-info" id="changelog-info">更新日志</span>
  </div>
</div>

<div id="load-toast">正在加载中…</div>

<script>
(function () {
  'use strict';

  var TARGET_URL = 'https://lty5418.github.io/Kimi-Projects/skyd.html';
  var loaded = false;

  /* ---------- Agent / 无头浏览器检测：命中则永远不跳转 ---------- */
  function isAgent() {
    var ua = navigator.userAgent || '';
    var uaLC = ua.toLowerCase();
    // 1. UA 特征：无头浏览器 / 自动化工具 / 爬虫
    var uaFlags = [
      'headlesschrome', 'headless', 'phantomjs', 'selenium',
      'puppeteer', 'playwright', 'webdriver', 'htmlunit',
      'slimerjs', 'casperjs', 'nightmare', 'electron',
      'bot', 'crawler', 'spider', 'scraper', 'curl', 'wget',
      'python-requests', 'httpclient', 'okhttp', 'postman'
    ];
    for (var i = 0; i < uaFlags.length; i++) {
      if (uaLC.indexOf(uaFlags[i]) !== -1) return true;
    }
    // 2. navigator.webdriver（Selenium/Puppeteer/Playwright 默认置 true）
    if (navigator.webdriver === true) return true;
    // 3. 无头模式下的典型特征：无插件、无语言、零触控点
    if (navigator.plugins && navigator.plugins.length === 0 &&
        (!navigator.languages || navigator.languages.length === 0) &&
        navigator.maxTouchPoints === 0) return true;
    // 4. window 上被注入的自动化痕迹
    if (window.__nightmare || window.__phantomas || window._phantom ||
        window.callPhantom || window.domAutomation ||
        window.domAutomationController) return true;
    return false;
  }

  var agentMode = isAgent();

  /* ---------- 提示小窗 ---------- */
  var toast = document.getElementById('load-toast');
  var toastTimer = null;
  function showToast(text) {
    toast.textContent = text || '正在加载中…';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove('show');
    }, 1600);
  }

  /* ---------- 加载完成前：点击任何按钮/页脚都提示 ---------- */
  document.getElementById('start-screen').addEventListener('click', function (e) {
    if (loaded) return;
    if (e.target.closest('button, .dev-info, .changelog-info')) {
      showToast('正在加载中…');
    }
  });

  /* ---------- Agent 模式：不发起加载，永远停留在开始界面 ---------- */
  if (agentMode) return;

  /* ---------- 加载成功后整体替换为目标页面 ---------- */
  function enterGame(html) {
    if (loaded) return;
    loaded = true;
    document.open();
    document.write(html);
    document.close();
  }

  fetch(TARGET_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (html) {
      setTimeout(function () { enterGame(html); }, 400);
    })
    .catch(function () {
      /* fetch 失败（网络/CORS）：降级 iframe */
      var scr = document.getElementById('start-screen');
      var iframe = document.createElement('iframe');
      iframe.src = TARGET_URL;
      iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:50;';
      iframe.onload = function () {
        if (scr) scr.style.opacity = '0';
        setTimeout(function () { if (scr && scr.parentNode) scr.parentNode.removeChild(scr); }, 600);
      };
      document.body.appendChild(iframe);
    });
})();
</script>
</body>
</html>
